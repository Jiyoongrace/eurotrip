<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="icon.svg"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>프라하·비엔나·부다페스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: full-screen map, draggable bottom sheet on phone / fixed left panel on desktop. Booking cards are ticket stubs. */
:root{
  --paper:#EEF1F0; --card:#FFFFFF; --ink:#16202B; --muted:#5B6670; --line:#D5DCDB; --soft:#E3E8E7;
  --prg:#B5452B; --vie:#9C6F14; --bud:#17706B; --de:#3F5F86; --warn:#8A5A00; --warnbg:#FBF1DC;
  --shadow:0 10px 30px rgba(22,32,43,.16);
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1519; --card:#182229; --ink:#E6ECEE; --muted:#94A1A9; --line:#2B3740; --soft:#202C34;
  --prg:#E27C5F; --vie:#D8AA48; --bud:#4DB6AD; --de:#8FB0D8; --warn:#E8B94F; --warnbg:#2E2716; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1519; --card:#182229; --ink:#E6ECEE; --muted:#94A1A9; --line:#2B3740; --soft:#202C34;
  --prg:#E27C5F; --vie:#D8AA48; --bud:#4DB6AD; --de:#8FB0D8; --warn:#E8B94F; --warnbg:#2E2716; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden}

/* ---------- Leaflet core (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-box{width:0;height:0;z-index:800}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon,.leaflet-pane>svg path{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-control-attribution{background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--muted);font-size:10px;padding:0 6px;margin:0;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:var(--muted)}

/* ---------- Map ---------- */
#map{position:absolute;inset:0;background:var(--soft)}
#map.no-tiles{background-color:var(--soft);background-image:radial-gradient(color-mix(in srgb,var(--muted) 35%,transparent) 1px,transparent 1px);background-size:18px 18px}
#map .leaflet-tile-pane{filter:saturate(.8) contrast(.96)}
#map.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}
.map-note{position:absolute;left:12px;right:12px;top:118px;z-index:1100;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;box-shadow:var(--shadow)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;border:2px solid var(--card);box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .2s}
.pin b{transform:rotate(45deg);color:#fff;font:600 12.5px/1 var(--f-mono)}
.pin.on{transform:rotate(-45deg) scale(1.28)}
.pin.on::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--c);opacity:.6;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.7}to{transform:scale(1.5);opacity:0}}
.pin.hotel{border-radius:8px;transform:none;background:var(--ink)}
.pin.hotel b{transform:none;color:var(--card)}
.pin.dot{width:14px;height:14px;border-width:2px}
.lbl{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:translate(20px,-22px);display:inline-block;pointer-events:none}


/* ---------- 그림 지도 ---------- */
:root{--sea:#CFE5EA;--land-cz:#F7D9CF;--land-at:#F8EABF;--land-hu:#D3EAD8;--land-etc:#EDE9E0;--mapline:#FFFFFF;--river:#86BEDC;--riverbank:#D8EEF6;--f-cute:"Jua","IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#132329;--land-cz:#3D2B27;--land-at:#3C3525;--land-hu:#23372B;--land-etc:#23282A;--mapline:#0F1519;--river:#3B7D9C;--riverbank:#1C3A47}}
:root[data-theme="dark"]{--sea:#132329;--land-cz:#3D2B27;--land-at:#3C3525;--land-hu:#23372B;--land-etc:#23282A;--mapline:#0F1519;--river:#3B7D9C;--riverbank:#1C3A47}
#map{background-color:var(--sea);background-image:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 1.2px);background-size:16px 16px}
#map.real{background-image:none}
.land{stroke:var(--mapline);stroke-dasharray:6 5}
.land-cz{fill:var(--land-cz)}.land-at{fill:var(--land-at)}.land-hu{fill:var(--land-hu)}.land-etc{fill:var(--land-etc)}
.lake{fill:var(--river);stroke:var(--riverbank)}
.island{fill:color-mix(in srgb,var(--land-hu) 70%,#7CC08E)}
.river{stroke:var(--river);fill:none}.river-bank{stroke:var(--riverbank);fill:none}
.ring{stroke:color-mix(in srgb,var(--vie) 55%,transparent);fill:none}
.route{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.clabel{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:14px var(--f-cute);color:color-mix(in srgb,var(--ink) 45%,transparent);pointer-events:none}
.clabel.main{font-size:19px;color:color-mix(in srgb,var(--ink) 70%,transparent);text-shadow:0 1px 0 var(--mapline)}
.rlabel{display:inline-block;transform:translate(-50%,-50%) rotate(-12deg);white-space:nowrap;font:13px var(--f-cute);color:color-mix(in srgb,var(--river) 70%,var(--ink));font-style:italic;pointer-events:none}
.park{fill:color-mix(in srgb,var(--land-hu) 55%,#8FCB98)}
.dlabel{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:15px var(--f-cute);letter-spacing:.04em;color:color-mix(in srgb,var(--ink) 30%,transparent);pointer-events:none}
.lbl-sm{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:12px var(--f-cute);color:var(--vie);pointer-events:none}
.peak{font-size:20px;filter:saturate(.7);opacity:.85;pointer-events:none}
.zhi .peak,.zhi .clabel{display:none}
.zhi-only{display:none}.zhi .zhi-only{display:inline-block}
.zhi .rlabel:not(.zhi-only){display:none}
.sticker{transform:translate(-50%,-17px);display:inline-flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--ink);white-space:nowrap}
.sticker .e{width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;font-size:18px;line-height:1;transition:transform .15s}
.sticker:hover .e{transform:rotate(-8deg) scale(1.08)}
.sticker .t{display:flex;align-items:baseline;gap:4px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px}
.sticker b{font:13.5px var(--f-cute);font-weight:400}.sticker small{font-size:10.5px;color:var(--muted)}
.daytag{display:inline-block;transform:translate(-50%,-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:3px 10px;font:13px var(--f-cute);white-space:nowrap}
.sp{position:relative;width:38px;height:38px;transform:translate(var(--dx,0px),var(--dy,0px));border-radius:50%;background:var(--card);border:3px solid var(--c);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent),0 6px 14px rgba(0,0,0,.18);transition:transform .2s}
.sp .e{font-size:19px;line-height:1}
.sp b{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#fff;font:600 11px/20px var(--f-mono);text-align:center;padding:0 5px;border:2px solid var(--card)}
.sp .nm{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--ink);font:12.5px var(--f-cute);padding:2px 8px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:none;pointer-events:none}
.zmax .sp .nm,.sp.on .nm{display:block}
.sp.on{transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.25);z-index:2}
@media (prefers-reduced-motion:no-preference){.sp.on{animation:hop .6s ease-out}}
@keyframes hop{0%{transform:translate(var(--dx,0px),var(--dy,0px)) scale(1)}40%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 10px)) scale(1.3)}100%{transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.25)}}
.maptoggle{position:absolute;right:12px;top:128px;z-index:1250;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:13px var(--f-cute);box-shadow:var(--shadow)}
@media (min-width:900px){.maptoggle{top:auto;bottom:20px}}

/* ---------- Top bar ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:1200;padding:12px 12px 0;display:grid;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);justify-self:start;max-width:100%}
.brand h1{margin:0;font:700 17px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dday{font:600 12px/1 var(--f-mono);background:var(--ink);color:var(--card);border-radius:8px;padding:6px 8px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -12px;padding-inline:12px}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 11px;display:grid;gap:1px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:background .15s,color .15s}
.chip .d{font:600 12px/1.1 var(--f-mono);color:var(--c,var(--muted))}
.chip .t{font-size:12.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip[aria-pressed="true"] .d{color:inherit;opacity:.75}
.chip .today{font-size:10px;font-weight:600;color:var(--prg)}

/* ---------- Sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1300;height:calc(100% - 64px);background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translateY(var(--y,50%));transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.dragging{transition:none}
.grab{flex:none;padding:8px 16px 0;touch-action:none;cursor:grab}
.handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}

/* ---------- Day header ---------- */
.dayhead{display:grid;gap:8px;margin-bottom:14px}
.dayhead .eyebrow{font:600 12px/1 var(--f-mono);color:var(--c);letter-spacing:.04em}
.dayhead h2{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:9px}

.alert{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 14px}
.alert strong{color:var(--warn);display:block;margin-bottom:4px;font-size:13px}
.alert ul{margin:0;padding-left:18px}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 5px,transparent 5px 9px)}
.stop{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:6px 0}
.num{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--c);color:var(--c);font:600 13px/1 var(--f-mono)}
.num.none{border-style:dashed;border-color:var(--line);color:var(--muted)}
.stop.on .num{background:var(--c);color:#fff}
.body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:5px;min-width:0;transition:border-color .15s,box-shadow .15s}
.stop.clickable .body{cursor:pointer}
.stop.on .body{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.time{font:500 12px/1 var(--f-mono);color:var(--muted)}
.kind{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.stars{color:var(--vie);font-size:12px;letter-spacing:1px}
.name{font-weight:600;font-size:15.5px;line-height:1.35}
.orig{color:var(--muted);font-size:12.5px}
.note{font-size:13.5px;color:var(--ink);opacity:.85}
.approx{font-size:11.5px;color:var(--warn)}
.stop .actions{margin-top:3px}

/* ---------- Overview cards ---------- */
.ov{display:grid;gap:10px}
.ovcard{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ovcard .date{display:grid;justify-items:center;border-right:1px solid var(--line);padding-right:10px}
.ovcard .date b{font:700 22px/1 var(--f-display);color:var(--c)}
.ovcard .date span{font:500 11px/1.4 var(--f-mono);color:var(--muted)}
.ovcard .ttl{font-weight:600}
.ovcard .ln{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}

/* ---------- Tickets ---------- */
.drive{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;text-decoration:none}
.drive svg{width:22px;height:22px;flex:none;color:var(--bud)}
.drive span{display:grid;gap:1px;min-width:0}.drive small{color:var(--muted);font-size:12px}
.drive-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:grid;gap:10px}
.dv-head{display:flex;align-items:center;gap:12px}
.dv-head svg{width:22px;height:22px;flex:none;color:var(--bud)}
.dv-head span{display:grid;gap:1px;min-width:0}.dv-head small{color:var(--muted);font-size:12px}
.dv-list{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.file a.fn{text-decoration:none;color:var(--ink)}
.file .tag{flex:none;font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 5px;background:color-mix(in srgb,var(--bud) 15%,transparent);color:var(--bud)}
.file .tag.here{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--muted)}
.dv-sub{font-size:12.5px;color:var(--muted)}
.file .x.save{color:var(--bud);font-weight:600}
.file .x:disabled{opacity:.6}
.sec-t{font:700 13px/1 var(--f-display);color:var(--muted);letter-spacing:.06em;margin:18px 0 10px}
.sec-t:first-child{margin-top:0}
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ticket .main{padding:12px 14px 12px 18px;display:grid;gap:4px;border-left:5px solid var(--c)}
.tk-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tk-type{font:600 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--c)}
.tk-date{font:500 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.tk-title{font-weight:600;font-size:16px;line-height:1.35}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:4px 0}
.route .code{font:700 22px/1 var(--f-display)}
.route .tm{font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.route .line{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);position:relative}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:13px;margin-top:2px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.stub{position:relative;border-top:2px dashed var(--line);padding:10px 14px 12px 18px;display:grid;gap:8px}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.stub::before{left:-11px}.stub::after{right:-11px}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:6px 8px 6px 10px;font-size:13px}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;text-align:left;padding:2px 0;font-weight:500}
.file .x{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:6px}
.file .x.confirm{background:var(--prg);color:#fff}
.empty{font-size:12.5px;color:var(--muted)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tiny{font-size:12px;color:var(--muted);margin:4px 0 0}

/* ---------- Info ---------- */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:11.5px;color:var(--muted)}
.fact .v{font-weight:600;font-size:14.5px;line-height:1.35}
.country{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.country h3{margin:0 0 6px;font:700 17px/1.2 var(--f-display);display:flex;align-items:center;gap:8px}
.country h3 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.country .cur{font:500 12px var(--f-mono);color:var(--muted);margin-left:auto}
.country ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
.copy{border:0;background:var(--soft);border-radius:6px;font-size:11.5px;padding:2px 7px;margin-left:6px;color:var(--muted)}


/* ---------- Guide ---------- */
.ovh{font-size:20px!important;line-height:1.45!important}
.inav{position:sticky;top:-14px;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-14px -16px 12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.inav::-webkit-scrollbar{display:none}
.inav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.isec{scroll-margin-top:60px;margin-bottom:22px}
.big{font:700 21px/1.3 var(--f-display);margin:0 0 8px;text-wrap:balance}
.lead{font-size:16px;line-height:1.7;margin:0 0 10px;font-weight:500}
.rd,.gd-b p,.story-body p{font-size:14.5px;line-height:1.75;margin:0 0 10px;max-width:62ch}
.tline{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tline li{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:6px 0 6px 14px}
.tline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.tline span{font:600 12.5px/1.6 var(--f-mono);color:var(--ink)}
.tline p{margin:0;font-size:13.5px;line-height:1.6}
.names{display:grid;gap:8px}
.names > div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.names b{font-size:14.5px}.names p{margin:3px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink);opacity:.85}
.gd{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.gd summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-left:4px solid var(--c)}
.gd summary::-webkit-details-marker{display:none}
.gd summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.gd[open] summary::after{transform:rotate(-135deg)}
.flag{font-size:24px;line-height:1;flex:none}
.gd-t{display:grid;gap:2px;min-width:0}
.gd-t b{font-size:15.5px}.gd-t b em{font-style:normal;font:500 11.5px var(--f-mono);color:var(--c);margin-left:4px}
.gd-t small{font-size:12.5px;color:var(--muted);line-height:1.45}
.gd-b{padding:4px 16px 14px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.gd-b>*,.gal,.story-body>*{min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.spot summary{padding:10px 14px}
.spot-city{font:700 14px var(--f-display);color:var(--c);margin:14px 0 8px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.meta-row span{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 8px;color:var(--muted)}
.st-k{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.st-box{background:var(--soft);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
.st-box ul,.tipg ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13.5px;line-height:1.6}
.st-tip{font-size:13.5px;line-height:1.6;margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 7%,transparent);border-radius:0}
.phr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:6px 0 4px}
.phr div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:1px}
.phr span{font-size:11.5px;color:var(--muted)}.phr b{font-size:14.5px}.phr small{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.tipg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.facts{display:grid;gap:6px;margin-top:10px}
.facts div{display:flex;gap:10px;font-size:13.5px}.facts span{color:var(--muted);min-width:64px}
.story-btn{border-color:var(--c);color:var(--c)}
.story{position:fixed;inset:0;z-index:4500;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.story-card{background:var(--paper);width:100%;max-width:640px;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.story{align-items:center}.story-card{border-radius:20px;max-height:80%}}
.story-head{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.story-head>div{flex:1;min-width:0}
.story-meta{font:500 12px var(--f-mono);color:var(--c)}
.story-head h2{margin:4px 0 0;font:700 22px/1.25 var(--f-display);text-wrap:balance}
.story-x{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:13px;flex:none}
.story-body{overflow-y:auto;padding:14px 18px 22px}


/* ---------- Rich text ---------- */
mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c,var(--vie)) 28%,transparent) 55%);color:inherit;font-weight:600;padding:0 1px}
.term{white-space:nowrap}
.term .q{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:2px;border-radius:50%;background:var(--soft);color:var(--muted);vertical-align:1px;text-decoration:none}
.term .q svg{width:10px;height:10px}
.term .q:hover,.term .q:focus-visible{background:var(--ink);color:var(--card)}
.yr{font-family:var(--f-mono);font-size:.9em;font-weight:500;background:var(--soft);border-radius:5px;padding:0 4px;white-space:nowrap}
.tline .yr,.art-m .yr{background:none;padding:0}
/* ---------- Art carousel ---------- */
.art{margin:0 0 18px}
.art-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.art-head span{font:700 15px var(--f-display)}
.art-head em{font:500 12px var(--f-mono);font-style:normal;color:var(--c)}
.art-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;overscroll-behavior-x:contain}
.art-track::-webkit-scrollbar{display:none}
.story-body .art-track{margin:0 -18px;padding-inline:18px}
.art-card{flex:0 0 84%;max-width:380px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.art-img{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--soft) center/cover no-repeat;background-color:color-mix(in srgb,var(--c) 18%,var(--soft))}
.art-img:not(.ok)::after{content:"이미지 불러오는 중";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
.art-n{position:absolute;right:10px;top:10px;z-index:1;background:rgba(0,0,0,.55);color:#fff;font:500 11px var(--f-mono);border-radius:999px;padding:2px 8px}
.art-b{padding:12px 14px 14px;display:grid;gap:4px}
.art-t{font:700 18px/1.3 var(--f-display)}
.art-m{font-size:13px;color:var(--c);font-weight:600}
.art-en{font-size:12px;color:var(--muted);font-style:italic}
.art-b p{font-size:14px;line-height:1.7;margin:6px 0 4px}
.art-b ul{margin:4px 0 6px;padding-left:18px;display:grid;gap:4px;font-size:13.5px;line-height:1.6}
.art-bio{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:4px}
.art-bio b{font-size:13.5px}.art-bio p{font-size:13px;margin:4px 0 0}
.art-src{font-size:11px;color:var(--muted);margin-top:6px}
.art-hint{font-size:12px;color:var(--muted);text-align:right}


/* ---------- Gallery (썸네일 줄 + 감상 모드) ---------- */
.gal{margin:0 0 16px}
.gal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.gal-head span{font:700 15px var(--f-display)}
.gal-head em{font:500 12px var(--f-mono);font-style:normal;color:var(--c)}
.gal-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.gal-row::-webkit-scrollbar{display:none}
.story-body .gal-row{margin:0 -18px;padding-inline:18px}
.gd-b .gal-row{margin:0 -16px 0 -18px;padding-inline:18px 16px;scroll-padding-inline:18px}
.gal-tile{flex:0 0 132px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:grid;gap:3px}
.gal-frame{display:block;width:132px;height:160px;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--c) 20%,var(--soft));box-shadow:0 6px 16px rgba(0,0,0,.14);position:relative}
.gal-frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s,transform .3s}
.gal-frame img[data-state="ok"]{opacity:1}
.gal-tile:hover .gal-frame img{transform:scale(1.04)}
.gal-t{font-size:13px;font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal-a{font-size:11.5px;color:var(--muted)}
body.noscroll{overflow:hidden}
.artv{position:fixed;inset:0;z-index:6000;background:#0E1114;color:#EEF1F0;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1.05fr)}
.av-top{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px;display:grid;gap:8px}
.av-bars{display:flex;gap:4px}
.av-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25)}
.av-bars i.done,.av-bars i.on{background:#fff}
.av-bar2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.75)}
.av-bar2 button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:600}
.av-stage{position:relative;display:grid;place-items:center;padding:6px 14px;min-height:0;touch-action:pan-y}
.av-stage img{max-width:100%!important;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transition:opacity .35s}
.av-stage img[data-state="ok"]{opacity:1}
.av-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1}
.av-nav.prev{left:8px}.av-nav.next{right:8px}
.av-text{overflow-y:auto;background:#161B1F;border-radius:22px 22px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.av-count{font:500 12px var(--f-mono);color:rgba(255,255,255,.55)}
.av-text h2{margin:4px 0 2px;font:700 22px/1.25 var(--f-display);color:#fff}
.av-meta{font-size:13.5px;font-weight:600;color:var(--c)}
.av-en{font-size:12px;color:rgba(255,255,255,.5);font-style:italic;margin-bottom:6px}
.av-text p{font-size:14.5px;line-height:1.75;margin:8px 0;color:rgba(255,255,255,.9)}
.av-text ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.88)}
.av-box{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;margin:10px 0}
.av-box .st-k{color:rgba(255,255,255,.6)}
.av-text mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 45%,transparent) 55%);color:#fff}
.av-text .yr{background:rgba(255,255,255,.1);color:#fff}
.av-text .term .q{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.av-text .art-src{color:rgba(255,255,255,.45);font-size:11px}
@media (min-width:900px){.artv{grid-template-columns:minmax(0,1.4fr) minmax(360px,1fr);grid-template-rows:auto minmax(0,1fr)}.av-top{grid-column:1/-1}.av-text{border-radius:22px 0 0 0}}
/* ---------- 먼저 읽어요 ---------- */
.intro-lead{position:relative;background:var(--ink);color:var(--card);border-radius:18px;padding:18px 18px 16px;margin:0 0 14px}
.intro-lead .k{font:600 12px var(--f-mono);letter-spacing:.06em;opacity:.7}
.intro-lead h3{margin:6px 0 8px;font:700 21px/1.3 var(--f-display);text-wrap:balance;color:var(--card)}
.intro-lead p{margin:0;font-size:15px;line-height:1.75}
.intro-lead mark{background:linear-gradient(transparent 55%,rgba(216,170,72,.55) 55%);color:inherit}
.intro-lead .term .q{background:rgba(255,255,255,.18);color:inherit}
.intro-lead .yr{background:rgba(255,255,255,.14);color:inherit}
.ip{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:0 0 10px}
.ip .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.ip h4{margin:2px 0 4px;font:700 16px/1.35 var(--f-display)}
.ip p{margin:0;font-size:14.5px;line-height:1.75}


.gal-frame{border:3px solid var(--card);outline:1px solid var(--line)}
.gal-cta{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:18px 6px 7px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font:12.5px var(--f-cute)}
.gal-cta i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:8px;padding-left:1px}
.gal-tile:active .gal-frame{transform:scale(.97)}
.gal-frame{transition:transform .15s}
.gal-coach{display:inline-block;background:var(--ink);color:var(--card);font:13px var(--f-cute);border-radius:12px;padding:6px 12px;margin:0 0 10px;position:relative}
.gal-coach::after{content:"";position:absolute;left:24px;bottom:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.gal-row .gal-tile:first-child .gal-frame{animation:nudge 2.4s ease-in-out 3}}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateY(-6px) rotate(-2deg)}90%{transform:translateY(0) rotate(1deg)}}
.gtip{background:color-mix(in srgb,var(--c,var(--ink)) 9%,var(--card));border:1.5px dashed color-mix(in srgb,var(--c,var(--ink)) 55%,transparent);border-radius:14px;padding:10px 12px;margin:4px 0 10px}
.gtip-h{display:flex;align-items:center;gap:6px;margin-bottom:2px}.gtip-h b{font:15px var(--f-cute);font-weight:400}.gtip-h span{font-size:17px}
.gtip ul{margin:4px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13.8px;line-height:1.65}
.st-box.fun{background:color-mix(in srgb,var(--vie) 12%,var(--card))}


/* ---------- 명소 사진 ---------- */
.ph{margin:0 0 12px;min-width:0}
.ph-track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px}
.ph-track::-webkit-scrollbar{display:none}
.ph-s{position:relative;flex:0 0 100%;aspect-ratio:3/2;max-width:100%;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:var(--soft)}
.ph-s img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.ph-s img[data-state="ok"]{opacity:1}
.ph-skel{background:linear-gradient(90deg,var(--soft),color-mix(in srgb,var(--soft) 60%,var(--card)),var(--soft));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.ph-skel{animation:sk 1.2s linear infinite}}
@keyframes sk{to{background-position:-200% 0}}
.ph-n{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font:500 11px var(--f-mono);border-radius:999px;padding:2px 8px}
.ph-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.ph-cr{font-size:11px;color:var(--muted);text-decoration:none}
.ph-more{font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--soft);border-radius:999px;padding:3px 10px}
.ph-g{margin-bottom:6px}


/* ---------- 일정 유형별 스타일 ---------- */
:root{--t-sight:#6A4FC4;--t-food:#D4582B;--t-cafe:#8B5E3C;--t-show:#B2357C;--t-rest:#3C8A57;--t-stay:#2D5E91;--t-move:#5F6D78}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-sight:#A690F0;--t-food:#F08A5D;--t-cafe:#D0A07A;--t-show:#E77BB8;--t-rest:#78C593;--t-stay:#7EA9D8;--t-move:#9AA8B2}}
:root[data-theme="dark"]{--t-sight:#A690F0;--t-food:#F08A5D;--t-cafe:#D0A07A;--t-show:#E77BB8;--t-rest:#78C593;--t-stay:#7EA9D8;--t-move:#9AA8B2}
.stop .body{border-left:5px solid var(--c);border-radius:6px 14px 14px 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 7%,var(--card)),var(--card) 60%)}
.tchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:999px;padding:2px 8px}
.stop.ty-move .body,.stop.ty-stay .body{background:var(--card);border-style:dashed;border-left-style:solid;padding-block:8px}
.stop.ty-move .name,.stop.ty-stay .name{font-size:14.5px}
.stop.ty-move .num,.stop.ty-stay .num{border-style:dashed}
.stop.ty-food .name::before{content:"";}
.tlegend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tlegend span{font-size:12px;font-weight:600;color:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:999px;padding:2px 9px}
/* ---------- 섹션 대표 이미지 ---------- */
.lead-img{display:block;width:100%;aspect-ratio:16/9;max-width:100%;object-fit:cover;border-radius:14px;margin:0 0 12px;background:var(--soft);opacity:0;transition:opacity .4s}
.lead-img[data-state="ok"]{opacity:1}
.lead-img[data-state="fail"]{display:none}
.hero{position:relative;margin:0 0 12px;border-radius:16px;overflow:hidden;background:var(--soft);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.hero .lead-img{margin:0;border-radius:0;aspect-ratio:4/3}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.hero figcaption{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff;font:16px var(--f-cute);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.intro-lead .hero{margin:-4px -4px 14px}
.names > div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.names > div > div{min-width:0}
.names .pimg{width:64px;height:78px;border-radius:12px;object-fit:cover;object-position:top;background:var(--soft);opacity:0;transition:opacity .4s}
.names .pimg[data-state="ok"]{opacity:1}

   know:["카페에 들어가면 직원이 자리로 안내하거나 빈자리에 앉으면 돼요. 계산은 테이블에서 해요.","슈니첼은 원래 송아지고기(Wiener Schnitzel)예요. 돼지고기면 'vom Schwein'이라고 적혀 있어요.","교통권은 개찰구가 없는 대신 불시 검표가 있어요. 꼭 표를 사서 타세요."]},

 tips: [

 /* ---------------- Prague ---------------- */
 {id:"oldtown", city:"prg", o:["Old Town Square Prague"], name:"구시가 광장", era:"12세기~",
  story:["프라하 구시가지의 한가운데 있는 광장으로, 12세기부터 시장이 열리던 곳이에요. 둘러보면 고딕, 바로크, 로코코 건물이 한자리에 모여 있어서 '건축 박물관' 같아요.","광장 가운데 동상은 종교개혁가 얀 후스예요. 1415년 화형당한 뒤 500년이 지난 1915년에 세워졌어요. 구시청 앞 바닥에는 흰 십자가 27개가 박혀 있는데, 1621년 합스부르크에 반기를 들었던 보헤미아 지도자 27명이 이곳에서 처형된 자리예요."],
  look:["뾰족한 두 탑이 있는 틴 성모 교회. 해 질 녘과 밤에 특히 예뻐요.","구시청 앞 바닥의 흰 십자가 27개","얀 후스 동상"], tip:"크리스마스 마켓과 부활절 마켓이 열리는 곳이에요. 10월엔 거리 공연이 많아요."},
 {id:"orloj", city:"prg", o:["Prague Astronomical Clock"], name:"천문시계", era:"1410년",
  story:["1410년에 만들어진 시계로, **지금도 작동하는 천문시계 가운데 가장 오래된 것**이에요. 시간뿐 아니라 해와 달의 위치, 별자리까지 보여줘요.","매시 정각이 되면 해골 인형이 종을 치고, 위쪽 작은 창문으로 12사도 인형이 차례로 지나가요. 해골은 '누구도 죽음은 피할 수 없다'는 뜻이에요. 이 시계를 만든 장인이 다른 도시에 더 멋진 시계를 만들지 못하도록 눈을 멀게 했다는 무서운 전설도 있어요."],
  look:["정각 인형 쇼(약 45초)","아래쪽 달력판의 12개월 그림"], tip:"정각 직전에 사람이 가장 몰리고 소매치기도 많아요. 구시청 탑에 올라가면 광장이 한눈에 보여요."},
 {id:"charles", city:"prg", o:["Charles Bridge Prague"], name:"카를교", era:"1357–1402년",
  story:["카를 4세가 1357년에 짓기 시작해 약 45년 만에 완성한 돌다리예요. **1841년까지 블타바강을 건너는 유일한 다리**였어요. 황제가 점성술에 따라 1357년 9월 7일 5시 31분에 주춧돌을 놓았다고 전해지는데, 숫자를 이어 쓰면 **1-3-5-7-9-7-5-3-1**로 앞뒤가 똑같아요.","다리 양쪽에는 성인 조각상 30개가 서 있어요. 그중 가장 유명한 건 성 얀 네포무츠키예요. 왕비의 고해성사 내용을 왕에게 말하지 않아서 이 다리에서 강에 던져졌다는 전설이 있어요. 동상 아래 동판을 만지면 프라하에 다시 온다는 이야기가 있어서 그 부분만 반짝반짝해요."],
  look:["성 얀 네포무츠키 동상 아래 반짝이는 동판","다리 양 끝의 고딕 탑. 구시가 쪽 탑에 올라가면 프라하성이 정면으로 보여요.","강 위에서 보는 프라하성 야경"], tip:"낮에는 사람이 정말 많아요. 아침 7시 전이나 밤 10시 이후에 가면 완전히 다른 다리예요."},
 {id:"castle", city:"prg", o:["Prague Castle","St. Vitus Cathedral Prague"], name:"프라하성", era:"9세기~",
  story:["9세기에 세워진 뒤 천 년 넘게 보헤미아 왕, 신성 로마 제국 황제, 그리고 지금은 체코 대통령이 머무는 곳이에요. 하나의 성이 아니라 궁전, 성당, 골목이 모인 거대한 단지로, 기네스북에 **'세계에서 가장 큰 고대 성 단지'**로 올라 있어요.","가운데 우뚝 선 성 비투스 대성당은 1344년에 짓기 시작해 1929년에야 완성됐어요. **거의 600년이 걸린 셈**이에요. 안에는 알폰스 무하가 디자인한 스테인드글라스가 있어요. 구왕궁은 1618년 개신교 귀족들이 황제의 관리를 창밖으로 던진 '프라하 창밖 투척 사건'이 일어난 곳으로, 이 사건이 30년 전쟁의 시작이 되었어요."],
  look:["성 비투스 대성당 왼쪽(북쪽) 예배당의 무하 스테인드글라스","황금소로 22번지: 카프카가 한동안 글을 쓴 작은 파란 집","정문 위병 교대식(매시 정각, 정오에 가장 성대함)"], tip:"성 단지 마당은 무료로 들어갈 수 있고, 대성당 안쪽과 황금소로는 통합권이 필요해요."},
 {id:"lobko", city:"prg", o:["Lobkowicz Palace Café Prague"], name:"로브코비츠 궁전 카페", era:"16세기~",
  story:["프라하성 단지 안에서 유일하게 개인이 소유한 궁전이에요. 로브코비츠 가문은 나치와 공산 정권에 두 번이나 재산을 빼앗겼다가 1990년대에 되찾았어요.","이 가문은 베토벤의 후원자여서 베토벤이 교향곡 3번 '영웅'과 5번 '운명' 등을 로브코비츠 공작에게 헌정했어요. 궁전 박물관에는 베토벤과 모차르트의 친필 악보가 있어요."],
  look:["카페 발코니에서 내려다보는 말라스트라나의 빨간 지붕들"], tip:"창가 발코니 자리가 명당이에요. 박물관을 안 봐도 카페는 이용할 수 있어요."},
 {id:"rampart", city:"prg", o:["Garden on the Ramparts Prague Castle"], name:"프라하성 성벽 정원", era:"1920년대 정비",
  story:["프라하성 남쪽 성벽을 따라 이어진 정원이에요. 체코슬로바키아의 첫 대통령 마사리크가 슬로베니아 건축가 요제 플레치니크에게 맡겨 1920년대에 지금 모습으로 다듬었어요. 옛 요새였던 성벽이 시민의 산책로가 된 거예요.","1618년 창밖 투척 사건 때 던져진 관리들이 떨어진 곳도 이 성벽 아래였다고 해요. 기적처럼 모두 살아남았는데, 가톨릭 쪽은 천사가 받아줬다고, 개신교 쪽은 거름 더미에 떨어졌다고 주장했어요."],
  look:["성벽 위에서 보는 프라하 시내 파노라마","두 관리가 떨어진 자리를 기념하는 작은 오벨리스크"], tip:"여름 시즌(대략 4~10월)에만 여는 정원이에요."},
 {id:"wallen", city:"prg", o:["Wallenstein Garden Prague"], name:"발트슈타인 궁전 정원", era:"1620년대",
  story:["30년 전쟁 때 합스부르크 군 총사령관이었던 발렌슈타인(체코식 발트슈타인)이 지은 궁전이에요. 황제보다 더 화려한 궁전을 지으려고 집 스물몇 채를 허물었다고 해요. 결국 황제의 의심을 사서 암살당했어요.","지금은 체코 상원 의사당으로 쓰이고, 정원은 무료로 개방돼요."],
  look:["정원을 자유롭게 돌아다니는 공작새","종유석처럼 만든 '드립스톤 벽'. 자세히 보면 괴물 얼굴과 동물이 숨어 있어요."], tip:"사람이 적은 조용한 휴식처예요. 입장료가 없어요."},
 {id:"strahov", city:"prg", o:["Strahov Library Prague","Klášterní pivovar Strahov"], name:"스트라호프 수도원 · 도서관 · 양조장", era:"1143년~",
  story:["1143년에 세워진 수도원으로, 프라하성보다 더 높은 언덕에 있어요. 도서관에는 17~18세기에 만든 '신학의 방'과 '철학의 방'이 있는데, 천장까지 책이 빼곡한 바로크 서재가 '세계에서 가장 아름다운 도서관' 목록에 자주 올라요.","중세 수도원들은 직접 맥주를 빚었어요. 스트라호프 수도원 양조장도 그 전통을 이어 지금도 매장 안에서 맥주를 만들어요."],
  look:["도서관 복도의 '호기심의 방': 고래 뼈, 박제 도도새 등 신기한 수집품","수도원 앞 정원에서 보는 프라하 전망"], tip:"도서관 방 안에는 들어갈 수 없고 입구에서 들여다보는 방식이에요. 사진 촬영은 요금이 따로 있을 수 있어요."},
 {id:"hradcany", city:"prg", o:["Kuchyň Prague Hradčanské náměstí"], name:"흐라드차니 광장 · Kuchyň", era:"",
  story:["프라하성 정문 바로 앞 광장이에요. 대주교 궁전과 귀족 저택들이 둘러싸고 있어요. Kuchyň는 체코어로 '부엌'이라는 뜻이고, 가정식 체코 요리와 전망으로 유명한 식당이에요."],
  look:["광장 끝 난간에서 보는 프라하 시내 전경"], tip:"체코식 슈니첼은 돼지고기나 닭고기로 만드는 경우가 많아요."},
 {id:"porks", city:"prg", o:["Pork's Prague Mostecká"], name:"Pork's · 꼴레뇨", era:"",
  story:["카를교 말라스트라나 쪽 끝에 있는 식당이에요. 대표 메뉴 꼴레뇨(vepřové koleno)는 돼지 무릎을 맥주에 절여 겉은 바삭, 속은 촉촉하게 구운 요리예요. 독일의 슈바인스학센과 비슷해요."],
  look:[], tip:"1인 1꼴레뇨는 양이 많아요. 둘이서 하나 나눠 먹고 사이드를 추가하는 걸 추천해요. 겨자와 홀스래디시를 곁들여 먹어요."},
 {id:"savoy", city:"prg", o:["Café Savoy Prague"], name:"카페 사보이", era:"1893년",
  story:["1893년에 문을 연 카페로, 네오르네상스 양식의 화려한 천장이 유명해요. 한동안 천장이 가려져 있다가 복원되었어요. 프라하에서 가장 우아한 브런치·디저트 카페로 꼽혀요."],
  look:["고개를 들어 천장을 꼭 보세요."], tip:"인기가 많아서 예약하면 편해요."},
 {id:"trdlo", city:"prg", o:["Tradlo Prague"], name:"뜨르들로(굴뚝빵)", era:"",
  story:["반죽을 막대에 감아 돌리며 구운 뒤 설탕을 입힌 빵이에요. 사실 체코 전통 음식이라기보다 관광객 사이에서 유명해진 간식이에요. 원조는 헝가리 사람들이 사는 트란실바니아 지방의 '퀴르퇴슈칼라치'예요. Day8 부다페스트에서 원조 격인 굴뚝빵을 먹으며 비교해 보세요."],
  look:[], tip:"안에 아이스크림이나 초콜릿을 채운 버전이 인기예요."},
 {id:"havel", city:"prg", o:["Havelské tržiště Prague"], name:"하벨 시장", era:"1232년~",
  story:["1232년부터 이어진 것으로 알려진 오래된 노천 시장이에요. 지금은 과일, 꿀, 나무 장난감, 마리오네트 같은 기념품을 팔아요. 체코는 인형극(마리오네트)이 유네스코 무형유산으로 등록될 만큼 인형 문화가 발달했어요."],
  look:[], tip:"기념품 가격은 구시가 광장보다 조금 저렴한 편이에요."},
 {id:"powder", city:"prg", o:["Powder Tower Prague"], name:"화약탑", era:"1475년",
  story:["1475년에 지은 구시가지의 성문이에요. 17세기에 화약 창고로 쓰여서 '화약탑'이라는 이름이 붙었어요.","보헤미아 왕의 대관식 행렬이 바로 여기서 출발했어요. 화약탑에서 첼레트나 거리, 구시가 광장, 카를교를 지나 프라하성까지 가는 길이 '왕의 길'이에요."],
  look:["바로 옆 시민회관(Obecní dům): 아르누보 건축의 걸작이고, 1918년 체코슬로바키아 독립이 선포된 곳이에요."], tip:"탑 위 전망대에 올라갈 수 있어요."},
 {id:"pilsner", city:"prg", o:["Pilsnerka Národní Prague"], name:"필스너카 · 체코 맥주", era:"1842년~",
  story:["필스너 우르켈 맥주 전문 펍이에요. 1842년 체코 플젠에서 만든 필스너 우르켈은 **세계 최초의 황금빛 라거**로, '필스너'라는 맥주 종류의 이름이 여기서 나왔어요. 지금 전 세계 맥주의 대부분이 이 스타일을 따라 한 거예요.","양조장에서 살균하지 않은 채 탱크로 바로 받아오는 '탱크 맥주(tankové pivo)'가 특히 신선해요."],
  look:[], tip:"거품이 많은 '믈리코(mlíko)'는 거의 거품만 담아주는 체코식 따르기예요. 타르타르(tatarák)는 마늘을 문지른 튀긴 빵에 올려 먹어요."},
 /* ---------------- Day 4 ---------------- */
 {id:"vitustower", city:"prg", o:["Great South Tower St. Vitus Cathedral"], name:"성 비투스 대성당 남쪽 탑 전망대", era:"14–16세기",
  story:["성 비투스 대성당 옆구리에 솟은 가장 높은 탑이에요. 계단 **287개**를 걸어 올라가면 프라하성 지붕들과 블타바강, 빨간 지붕 바다가 360도로 펼쳐져요.","탑 안에는 체코에서 가장 큰 종 '**지그문트**'가 있어요. 16세기에 만든 무게 약 13톤짜리 종으로, 지금도 큰 국가 행사 때 울려요. 탑 중간의 황금빛 시계와 격자 장식은 르네상스 시대에 덧붙인 거예요."],
  look:["올라가는 길 중간의 지그문트 종","전망대에서 내려다보는 대성당 지붕의 조각과 괴물 모양 물받이(가고일)"], tip:"계단이 좁고 가팔라요. 사람이 몰리기 전, 성에 도착하자마자 먼저 올라가는 걸 추천해요."},
 {id:"malastrana", city:"prg", o:["Malá Strana Prague"], name:"말라스트라나", era:"1257년~",
  story:["'**작은 지구**'라는 뜻으로, 프라하성 아래 강 서쪽에 펼쳐진 동네예요. 1257년에 도시로 만들어졌고, 바로크 시대 귀족들이 성 가까이에 앞다퉈 저택을 지었어요. 그 저택들이 지금은 각국 **대사관**으로 쓰여서 골목마다 국기가 걸려 있어요.","옛날에는 집 번지수 대신 문 위에 그림 간판을 달아 집을 구분했어요. 성으로 올라가는 **네루도바 거리**에서 '두 개의 태양', '황금 열쇠' 같은 간판을 찾아보세요."],
  look:["네루도바 거리의 집 간판","골목 사이로 올려다보이는 프라하성"], tip:"말라스트라나 광장 근처에 카페와 빵집이 많아서 쉬어 가기 좋아요."},
 {id:"nicholas", city:"prg", o:["St. Nicholas Church Malá Strana"], name:"성 니콜라스 성당 (말라스트라나)", era:"1704–1755년",
  story:["초록 돔과 종탑이 말라스트라나 하늘을 채우는 성당으로, 체코 **바로크 건축의 최고 걸작**으로 꼽혀요. 딘첸호퍼 부자가 2대에 걸쳐 50년 넘게 지었어요.","**모차르트**가 1787년 프라하에 머물 때 이곳 오르간을 연주했고, 1791년 그가 세상을 떠나자 이 성당에서 수천 명이 모인 추모 미사가 열렸어요. 공산 정권 시절엔 종탑이 서방 대사관을 감시하는 비밀경찰 초소로 쓰였다고 해요."],
  look:["천장 프레스코: 들어서면 고개가 저절로 젖혀져요","모차르트가 연주한 파이프 오르간"], tip:"종탑에 따로 올라갈 수 있어요. 카를교와 말라스트라나 지붕이 가까이 보여요."},
 {id:"kampa", city:"prg", o:["Kampa Island Prague"], name:"캄파섬", era:"",
  story:["블타바강과 좁은 물길 '**체르토프카**(악마의 개울)' 사이에 있는 작은 섬이에요. 카를교 바로 아래라 관광객이 적은 조용한 쉼터예요. 물길 옆 오래된 물레방아와 강가 집들 때문에 '**프라하의 베네치아**'라고도 불려요.","섬 근처에는 공산 시절 자유를 바라는 낙서가 이어진 '**존 레넌 벽**'이 있어요. 지금도 사람들이 계속 덧그려서 매번 모습이 달라요."],
  look:["체르토프카 물레방아","캄파 미술관 앞 체코 작가 다비드 체르니의 거대한 '기어가는 아기' 조각","존 레넌 벽"], tip:"📸 캄파섬 강변에서 보는 카를교와 구시가 야경이 프라하 최고의 야경 포인트 중 하나예요."},
 {id:"zwinger", city:"dre", o:["Zwinger Dresden"], name:"츠빙거 궁전", era:"1710–1728년",
  story:["아우구스트 강건왕이 축제와 연회를 열려고 지은 바로크 궁전이에요. 성벽 사이 빈터를 뜻하는 '츠빙거'라는 이름처럼, 옛 요새 자리에 화려한 정원과 회랑을 둘렀어요.","안쪽 **고전 거장 미술관**에는 라파엘로의 '**시스티나 성모**'가 있어요. 그림 아래 턱을 괴고 있는 두 아기 천사는 전 세계 엽서와 머그컵에 가장 많이 쓰인 그림 조각 중 하나예요."],
  look:["금빛 왕관을 얹은 '왕관 문(Kronentor)'","님프 목욕탕 분수","미술관의 '시스티나 성모' 아기 천사"], tip:"안뜰은 무료로 들어가요. 미술관은 시간이 되면 '시스티나 성모'만이라도 보세요."},
 {id:"semper", city:"dre", o:["Semperoper Dresden"], name:"젬퍼오퍼", era:"1841년~",
  story:["건축가 고트프리트 젬퍼가 지은 작센 국립오페라극장이에요. 바그너의 '방황하는 네덜란드인', '탄호이저', 슈트라우스의 '살로메', '장미의 기사'가 이 무대에서 처음 공연됐어요.","화재와 1945년 폭격으로 두 번 무너졌고, 폭격 꼭 40년 뒤인 **1985년 2월 13일**에 다시 문을 열었어요."],
  look:["정면 위 네 마리 표범이 끄는 마차 조각"], tip:"독일 라데베르거 맥주 광고에 나오는 그 건물이라 현지인들은 '맥주 극장'이라고 농담해요."},
 {id:"fuerstenzug", city:"dre", o:["Fürstenzug Dresden"], name:"군주의 행렬", era:"1872–1907년",
  story:["길이 약 **102m** 벽을 따라 작센을 다스린 군주 35명이 말을 타고 행진하는 거대한 벽화예요. 원래는 긁어서 그린 벽화였는데, 비바람에 상하자 **마이센 도자기 타일 약 2만 3천 장**으로 다시 만들었어요.","1945년 폭격 때 주변이 다 불탔는데도 이 도자기 벽화는 거의 그대로 살아남았어요."],
  look:["행렬 맨 끝, 모자를 들고 걷는 사람들: 벽화를 만든 화가와 당시 예술가들이에요."], tip:"벽이 길어서 반대편 길가에서 봐야 한 프레임에 들어와요."},
 {id:"frauenkirche", city:"dre", o:["Frauenkirche Dresden"], name:"프라우엔키르헤 (성모 교회)", era:"1726–1743년 · 2005년 재건",
  story:["돌로 쌓은 거대한 돔이 '**돌로 된 종**'이라 불린 개신교 교회예요. 1945년 폭격 이틀 뒤 불길을 견디지 못하고 무너졌고, 동독 시절 내내 폐허 더미로 남아 반전의 상징이 됐어요.","통일 뒤 전 세계의 기부로 1994년부터 다시 지어 2005년에 완성했어요. 꼭대기 황금 십자가는 드레스덴을 폭격한 영국 공군 조종사의 아들인 영국 금세공사가 만들었어요. **화해**의 상징이에요."],
  look:["벽에 섞인 **검게 그을린 돌**: 폐허에서 건진 원래 돌을 제자리에 다시 끼운 거예요.","교회 앞 종교개혁가 마르틴 루터 동상"], tip:"안은 무료로 들어갈 수 있어요(예배 시간 제외). 밝은 파스텔 내부가 바깥과 전혀 달라요."},
 {id:"bruehl", city:"dre", o:["Brühlsche Terrasse Dresden"], name:"브륄의 테라스", era:"18세기",
  story:["엘베강을 따라 옛 성벽 위에 만든 산책로로, '**유럽의 발코니**'라고 불려요. 작센의 재상 브륄 백작이 개인 정원으로 쓰던 곳을 나중에 시민에게 열었어요."],
  look:["강 건너 신시가지와 엘베강 유람선","계단 아래 성벽 안 옛 요새(카제마텐)"], tip:"📸 테라스에서 츠빙거·대성당·젬퍼오퍼 방향을 돌아보면 드레스덴 엽서 풍경이 나와요."},
 {id:"bastei", city:"dre", o:["Bastei Bridge"], name:"작센스위스 · 바스타이 다리", era:"1851년",
  story:["엘베강 위 약 **190m** 높이 바위 봉우리들을 잇는 사암 다리예요. 1824년 나무다리를 놓았다가 1851년 지금의 돌다리로 바꿨어요. 독일에서 가장 유명한 풍경 중 하나예요.","작센스위스의 기암괴석은 독일 낭만주의 화가들에게 영감을 줬어요. 지금은 암벽 등반의 성지이기도 해요."],
  look:["다리 위 전망대에서 내려다보는 엘베강 굽이","옛 바위 성채 노이라텐 유적"], tip:"전망대까지 계단과 바위길이 이어져요. 바람이 세고 쌀쌀하니 겉옷을 챙기세요."},
 {id:"figlmuller", city:"vie", o:["Figlmüller Wollzeile Wien"], name:"Figlmüller 1호점", era:"1905년~",
  story:["1905년에 문을 연 비엔나 슈니첼의 대표 맛집이에요. 고기를 얇게 두드려 펴서 튀기기 때문에 **접시보다 큰 슈니첼**(지름 약 30cm)이 나와요. 원래 비엔나 슈니첼은 송아지고기지만, 피그뮐러는 **돼지고기**로 만든 슈니첼로 유명해요.","1호점은 골목 안 좁은 통로 같은 식당이라 예약 없이는 들어가기 어려워요. 예약해 두셨으니 11시에 맞춰 가면 돼요."],
  look:["접시 밖으로 삐져나온 슈니첼 크기"], tip:"곁들이로 비엔나식 **감자 샐러드(Erdäpfelsalat)**를 시켜보세요. 레몬을 짜서 먹는 게 정석이에요."},
 {id:"brewing1516", city:"vie", o:["1516 Brewing Company Wien"], name:"1516 Brewing Company", era:"",
  story:["가게 안에서 직접 맥주를 빚는 브루펍이에요. 이름의 **1516**은 독일 바이에른에서 '맥주는 물·보리·홉으로만 만든다'고 정한 **맥주 순수령**이 반포된 해예요.","두툼한 **폭립**이 대표 메뉴라, 벨베데레 투어 후 든든한 점심으로 좋아요."],
  look:[], tip:"직접 만든 맥주 여러 종을 조금씩 맛보는 샘플러가 있는지 물어보세요."},
 {id:"nicholas_ot", city:"prg", o:["St. Nicholas Church Old Town Prague"], name:"성 니콜라스 교회 (구시가)", era:"1732–1737년",
  story:["구시가 광장 북서쪽 모퉁이의 하얀 바로크 교회예요. 말라스트라나의 성 니콜라스 성당과 같은 건축가 **킬리안 이그나츠 딘첸호퍼**가 지었어요. 이름이 같은 두 성당이 강 양쪽에 하나씩 있는 셈이에요.","안에는 러시아 황제가 선물했다는 왕관 모양의 거대한 **크리스털 샹들리에**가 걸려 있어요. 지금은 저녁마다 클래식 공연장으로도 쓰여요."],
  look:["돔 아래 크리스털 샹들리에","교회 앞에서 보는 구시가 광장과 틴 성당"], tip:"입구 앞 안내판에 그날 저녁 공연 시간이 붙어 있어요. 짧은 오르간·현악 공연이 많아요."},
 {id:"krumlov", city:"ck", o:["Český Krumlov"], name:"체스키크룸로프 성과 마을", era:"13세기~",
  story:["13세기에 지어진 성은 로젠베르크 가문과 슈바르첸베르크 가문이 차례로 다스렸어요. 성 안에는 1760년대 바로크 극장이 당시 무대 장치 그대로 남아 있는데, 이렇게 온전한 바로크 극장은 세계에 몇 개 없어요.","마을 골목은 중세 모습 그대로라, 어느 방향으로 걸어도 성 탑이 보여요."],
  look:["알록달록하게 칠한 성 탑","성 입구 해자의 곰","망토 다리(Plášťový most): 성 건물을 잇는 3층 아치 다리"], tip:"성 정원 쪽 전망 포인트에서 강이 S자로 휘는 모습을 볼 수 있어요."},
 {id:"gosau", city:"hs", o:["Gosausee"], name:"고사우 호수", era:"",
  story:["다흐슈타인 산맥 아래 있는 빙하 호수예요. 맑은 날이면 해발 약 3,000m의 다흐슈타인 빙하 봉우리가 호수에 그대로 비쳐요. 오스트리아 사람들이 가장 사랑하는 풍경 중 하나예요."],
  look:["호숫가 산책로 초입에서 보는 산 반영"], tip:"아침이나 바람이 없을 때 반영이 가장 선명해요."},
 {id:"hallstatt", city:"hs", o:["Hallstatt"], name:"할슈타트 마을 · 스카이워크", era:"기원전~",
  story:["할슈타트 호수와 가파른 산 사이 좁은 땅에 자리 잡은 마을이에요. 소금 덕분에 선사시대부터 부유했고, 1997년 주변 지역과 함께 유네스코 세계유산이 되었어요.","마을 위 산에는 소금광산과 전망대 '스카이워크(Welterbeblick)'가 있어요. 푸니쿨라를 타고 올라가면 마을과 호수를 수백 미터 위에서 내려다볼 수 있어요.","성 미하엘 성당 옆 납골당에는 이름과 꽃무늬가 그려진 두개골이 수백 개 모셔져 있어요. 묘지가 좁아서 생긴 이 지역만의 독특한 풍습이에요."],
  look:["마을 북쪽 끝의 대표 엽서 뷰 포인트(호수와 교회 첨탑)","스카이워크 전망대","해골 납골당(Beinhaus)"], tip:"자유시간이 짧다면 마을 산책과 엽서 뷰 포인트에 집중하고, 스카이워크는 푸니쿨라 대기 시간을 보고 정하세요."},
 /* ---------------- Vienna ---------------- */
 {id:"stephan", city:"vie", o:["St. Stephen's Cathedral Vienna"], name:"성 슈테판 대성당", era:"12세기~",
  story:["비엔나의 상징이자 한가운데 있는 성당이에요. 남쪽 탑은 높이 약 136m로 '슈테플'이라는 애칭으로 불려요. 지붕에는 23만 장이 넘는 색 타일로 합스부르크의 쌍두 독수리와 오스트리아 문장이 그려져 있어요.","모차르트가 1782년 이곳에서 결혼식을 올렸고, 1791년 장례식도 여기서 치렀어요. 성당 지하에는 합스부르크 가문 사람들의 내장을 보관한 카타콤도 있어요."],
  look:["모자이크 지붕(북쪽 탑 전망대에서 가까이 보여요)","남쪽 탑 계단 343개","성당 안 16세기 설교단"], tip:"Day6 벨베데레 투어에 성당 설명이 포함돼 있어요. Day5에는 외관 위주로, Day6에 제대로 보면 좋아요."},
 {id:"graben", city:"vie", o:["Graben Vienna"], name:"그라벤 거리", era:"",
  story:["'그라벤'은 독일어로 '도랑'이라는 뜻이에요. 로마 시대 성벽 앞의 해자를 메워 만든 길이라서 이런 이름이 붙었어요. 지금은 비엔나에서 가장 고급스러운 보행자 거리예요.","가운데 솟은 페스트 기념탑은 1679년 흑사병이 끝난 것을 감사하며 세웠어요. 당시 비엔나 인구의 상당수가 흑사병으로 목숨을 잃었어요."],
  look:["페스트 기념탑의 조각들(구름과 천사가 뒤엉킨 바로크 스타일)"], tip:"그라벤과 케른트너 거리, 콜마르크트가 만나는 삼각형 구역이 쇼핑 중심가예요."},
 {id:"peter", city:"vie", o:["Peterskirche Vienna"], name:"성 베드로 성당", era:"1733년 완공",
  story:["그라벤 골목 안에 숨어 있는 바로크 성당이에요. 겉에서 보면 작은데 안에 들어가면 황금빛 제단과 둥근 천장 프레스코가 화려해서 놀라게 돼요. 로마 판테온에서 영감을 받은 타원형 구조예요."],
  look:["돔 천장 프레스코","황금빛 설교단"], tip:"무료 오르간 연주회가 자주 열려요. 입구 안내판에서 시간을 확인해 보세요."},
 {id:"anker", city:"vie", o:["Ankeruhr Vienna"], name:"앙커 시계", era:"1911–1917년",
  story:["보험회사 '앙커'의 두 건물을 잇는 다리에 달린 아르누보 시계예요. 매시간 비엔나 역사 속 인물이 한 명씩 지나가요. 로마 황제 마르쿠스 아우렐리우스, 마리아 테레지아, 작곡가 하이든 등 12명이에요."],
  look:["정오 12시: 12명이 모두 음악과 함께 행진해요."], tip:"12시에 맞춰 가면 가장 볼만해요."},
 {id:"khm", city:"vie", o:["Kunsthistorisches Museum Wien"], name:"빈 미술사 박물관", era:"1891년 개관",
  story:["합스부르크 가문이 수백 년 동안 모은 미술품을 시민에게 공개하려고 프란츠 요제프 황제가 세운 박물관이에요. 맞은편에 거의 똑같이 생긴 자연사 박물관이 쌍둥이처럼 마주 보고 있어요.","브뤼헐 작품을 세계에서 가장 많이 가진 곳이에요('바벨탑', '눈 속의 사냥꾼'). 벨라스케스가 그린 어린 마르가리타 공주 초상화들도 유명한데, 스페인 합스부르크 쪽에서 오스트리아 쪽 약혼자에게 '공주가 이렇게 자라고 있어요' 하고 보낸 사진 같은 그림이에요."],
  look:["중앙 계단 위 벽화: 젊은 클림트가 그렸어요.","돔 아래 카페: **'세계에서 가장 아름다운 카페'**로 자주 꼽혀요.","쿤스트카머: 첼리니의 황금 소금 그릇 '살리에라'"], tip:"가이드 투어 뒤 돔 카페에서 커피 한 잔 하면 좋아요."},
 {id:"demel", city:"vie", o:["Café Demel Vienna"], name:"카페 데멜", era:"1786년~",
  story:["1786년에 문을 연 황실 전용 제과점이었어요. 황후 시시가 이곳의 제비꽃 사탕을 좋아했다고 해요.","'원조 자허토르테'를 놓고 호텔 자허와 법정 다툼을 벌인 걸로 유명해요. 흔히 **'달콤한 7년 전쟁'**이라고 불러요. 결국 자허 쪽이 '오리지널' 이름을 쓰게 되었고, 데멜은 '에두아르트 자허 토르테'라는 이름으로 팔아요. Day7 카페 자허와 비교해 보세요."],
  look:["유리창 너머로 보이는 케이크 만드는 공방"], tip:"1층 쇼케이스에서 케이크를 고르고 자리에 앉아요."},
 {id:"karls", city:"vie", o:["Karlskirche Vienna"], name:"카를 성당", era:"1737년 완공",
  story:["1713년 비엔나에 흑사병이 돌자, 카를 6세 황제가 '역병이 끝나면 성당을 짓겠다'고 약속해서 세운 성당이에요. 흑사병 환자를 돌본 성인 카를로 보로메오에게 바쳤어요.","정면 양옆의 두 기둥은 로마의 트라야누스 기둥을 본떠 만들었어요. 그리스 신전 같은 입구, 로마 기둥, 바로크 돔이 한 건물에 섞여 있어요."],
  look:["성당 앞 연못에 비친 모습(밤 조명)","거대한 초록 돔"], tip:"콘서트 전 저녁에 연못 앞에서 사진 찍기 좋아요."},
 {id:"musikverein", city:"vie", o:["Musikverein Wien"], name:"무지크페라인", era:"1870년 개관",
  story:["빈 필하모닉 오케스트라의 본거지예요. 매년 1월 1일 전 세계로 중계되는 '빈 신년음악회'가 열리는 바로 그 황금홀(Großer Saal)이에요. 음향이 세계 최고 수준으로 꼽혀요.","홀 전체가 금빛 장식과 여신 기둥으로 꾸며져 있어서, 들어서는 순간 탄성이 나와요."],
  look:["금빛 천장과 벽을 받치는 여신상 기둥","파이프 오르간"], tip:"정장까지는 아니어도 깔끔한 옷차림이 좋아요. 코트는 유료 옷 보관소에 맡겨요."},
 {id:"albertina", city:"vie", o:["Albertina Vienna"], name:"알베르티나 미술관", era:"1776년 컬렉션 시작",
  story:["마리아 테레지아의 사위 알베르트 공작이 모은 컬렉션에서 시작된 미술관이에요. 판화와 드로잉을 약 100만 점 가지고 있어서 세계 최대급이에요. 뒤러의 '어린 토끼'가 유명한데, 원본은 빛에 약해서 거의 전시하지 않아요.","상설관에서는 모네, 르누아르, 피카소, 샤갈 같은 근현대 명작을 볼 수 있고, 합스부르크 시절 방들도 공개하고 있어요."],
  look:["미술관 테라스에서 보는 오페라극장","모네의 '수련' 등 인상파 작품"], tip:"Day7 오후에 여유 있게 1.5~2시간 잡았어요."},
 {id:"belvedere", city:"vie", o:["Upper Belvedere Vienna","Belvedere Garden Vienna"], name:"벨베데레 궁전", era:"1712–1723년",
  story:["1683년 빈 포위 이후 오스만 제국과의 전쟁에서 연전연승한 영웅, 사보이의 오이겐 공이 지은 여름 궁전이에요. '벨베데레'는 이탈리아어로 '아름다운 전망'이라는 뜻이에요. 위쪽 궁전과 아래쪽 궁전 사이에 프랑스식 정원이 펼쳐져 있어요.","지금은 미술관으로, **클림트의 '키스'가 여기 있어요**. 클림트 작품을 세계에서 가장 많이 가진 곳이에요. 또 1955년 오스트리아가 다시 독립한 국가조약이 서명된 역사적인 장소이기도 해요."],
  look:["클림트 '키스'","상궁 대리석 홀: 1955년 국가조약 서명 장소","정원 끝에서 보는 궁전과 비엔나 시내"], tip:"'키스' 앞은 붐벼요. 투어 시작이 이른 편이라 덜 붐빌 때 볼 수 있어요."},
 {id:"hofburg", city:"vie", o:["Hofburg Vienna"], name:"호프부르크 왕궁", era:"13세기~1918년",
  story:["13세기부터 1918년까지 합스부르크 황제들이 겨울을 보낸 궁전이에요. 수백 년 동안 계속 덧붙여 지어서 건물이 18개 동, 방이 2,600개가 넘어요. 지금은 오스트리아 대통령 집무실로도 쓰여요.","안에는 황제의 방, 시시 박물관, 은식기 컬렉션, 그리고 흰 말 리피자너가 공연하는 스페인 승마학교가 있어요. 영웅 광장 쪽 발코니는 1938년 히틀러가 오스트리아 병합을 선언한 곳이기도 해요."],
  look:["미하엘 문의 둥근 돔","부르크가르텐의 모차르트 동상(앞 잔디에 높은음자리표 꽃밭)","영웅 광장의 기마상 두 개"], tip:"시시 박물관에 관심이 있으면 시간을 따로 잡아야 해요. 이번엔 정원 위주로 봐요."},
 {id:"prunksaal", city:"vie", o:["Prunksaal Austrian National Library"], name:"오스트리아 국립도서관 대홀", era:"1720년대",
  story:["카를 6세가 황실 도서관으로 지은 바로크 대홀(프룽크잘)이에요. 길이 약 80m의 홀에 오래된 책 약 20만 권이 천장까지 꽂혀 있고, 돔 천장 전체가 프레스코로 덮여 있어요. '세계에서 가장 아름다운 도서관' 목록에 꼭 들어가요."],
  look:["가운데 돔 아래 카를 6세 동상","벽을 따라 놓인 거대한 지구본과 천구의"], tip:"30~45분이면 충분해요. 사진 찍기 좋은 곳이에요."},
 {id:"palmen", city:"vie", o:["Brasserie Palmenhaus Vienna"], name:"팔멘하우스", era:"1901–1905년",
  story:["부르크가르텐 안에 있는 아르누보 양식의 유리 온실이에요. 원래 황실용 온실이었고, 지금은 한쪽이 브라세리(식당 겸 카페), 한쪽은 열대 나비가 날아다니는 나비관이에요."],
  look:["야자수 아래 유리 천장"], tip:"날이 좋으면 정원 쪽 테라스 자리가 좋아요."},
 {id:"rathaus", city:"vie", o:["Wiener Rathaus"], name:"빈 시청", era:"1872–1883년",
  story:["고딕 대성당처럼 생겼지만 시청이에요. 링슈트라세 시대에 지은 건물로, 탑 꼭대기에는 '시청 사나이(라트하우스만)'라는 기사 동상이 서 있어요. 시청 앞 광장에서는 겨울엔 크리스마스 마켓과 스케이트장이, 여름엔 야외 영화제가 열려요."],
  look:["밤 조명을 받은 정면"], tip:"국회의사당과 바로 붙어 있어서 한 번에 보면 돼요."},
 {id:"parliament_at", city:"vie", o:["Austrian Parliament Building"], name:"오스트리아 국회의사당", era:"1883년",
  story:["그리스 신전처럼 생긴 건물이에요. 건축가가 '민주주의가 탄생한 고대 그리스'를 떠올리게 하려고 일부러 이 양식을 골랐어요. 앞에는 지혜의 여신 아테나 분수가 서 있어요. 몇 년 동안 대규모 보수 공사를 마치고 2023년 다시 문을 열었어요."],
  look:["아테나 분수"], tip:"무료 방문자 센터가 있어요."},
 {id:"central", city:"vie", o:["Café Central Vienna"], name:"카페 첸트랄", era:"1876년~",
  story:["1876년에 문을 연 비엔나의 대표 커피하우스예요. 러시아 혁명가 트로츠키, 정신분석학자 프로이트 같은 사람들이 단골이었다고 해요. 높은 아치형 천장이 궁전 같은 분위기예요.","입구 쪽 테이블에 앉아 있는 인형은 시인 페터 알텐베르크예요. 그는 이 카페를 거의 집처럼 써서 편지 받는 주소로도 적었다고 해요."],
  look:["입구의 알텐베르크 인형","아치형 천장"], tip:"줄이 길 때가 많아요. 저녁은 비교적 덜 붐벼요. '멜랑주(Melange)'는 비엔나식 카푸치노예요."},
 {id:"schonbrunn", city:"vie", o:["Schönbrunn Palace"], name:"쇤브룬 궁전", era:"18세기",
  story:["합스부르크 가문의 여름 궁전이에요. **방이 1,400개가 넘고**, 지금의 노란색 로코코 모습은 마리아 테레지아 때 완성됐어요. 이 노란색을 '쇤브룬 옐로'라고 부를 만큼 제국 곳곳의 건물이 따라 칠했어요.","여섯 살 모차르트가 거울의 방에서 연주한 뒤 넘어졌는데, 일으켜 준 동갑내기 공주 마리 앙투아네트에게 '크면 결혼해 줄게'라고 했다는 일화가 있어요. 프란츠 요제프 황제가 태어나고 세상을 떠난 곳, 그리고 1918년 마지막 황제가 통치에서 물러나는 문서에 서명한 곳도 여기예요."],
  look:["거울의 방","대회랑(그레이트 갤러리): 빈 회의 때 연회가 열린 곳","정원 끝 언덕 위 글로리에테"], tip:"궁전 안은 사진 촬영이 제한돼요. 오디오가이드로 방마다 이야기를 들으면 훨씬 재밌어요."},
 {id:"gloriette", city:"vie", o:["Gloriette Schönbrunn"], name:"글로리에테", era:"1775년",
  story:["쇤브룬 정원 끝 언덕 위에 세운 개선문 모양의 건축물이에요. 마리아 테레지아가 전쟁의 승리와 전사자를 기리려고 세웠어요. 궁전을 등지고 서면 정원과 비엔나 시내가 한눈에 들어와요."],
  look:["언덕에서 내려다보는 쇤브룬 궁전 전경"], tip:"안에 카페가 있어요. 언덕 오르막이 15분 정도 걸려요."},
 {id:"sura", city:"vie", o:["Sura Korean Restaurant Vienna"], name:"수라(한식)", era:"",
  story:["여행 중반에 한식으로 쉬어가는 날이에요. 쇤브룬 관람 뒤 든든하게 먹고 오후 미술관으로 이동해요."],
  look:[], tip:"점심 시간대 예약 가능 여부를 미리 확인하면 좋아요."},
 {id:"opera", city:"vie", o:["Vienna State Opera"], name:"빈 국립오페라극장", era:"1869년 개관",
  story:["링슈트라세에 가장 먼저 세워진 대형 건물로, 모차르트의 '돈 조반니'로 문을 열었어요. 완공 당시 '너무 낮고 밋밋하다'는 혹평이 쏟아졌고, 황제도 한마디 거들었어요. 그 뒤 건축가 두 사람이 모두 세상을 떠나자, 황제는 평생 어떤 건물을 봐도 '아름답군, 마음에 드네'라고만 말했다는 이야기가 전해요.","1년에 약 300일 공연이 열리고, 공연 당일 입석표는 몇 유로면 살 수 있어요."],
  look:["밤 조명을 받은 정면 아케이드"], tip:"외관만 10분이면 돼요. 공연이 없는 낮 시간에는 내부 가이드 투어도 있어요."},
 {id:"karntner", city:"vie", o:["Kärntner Straße Vienna"], name:"케른트너 거리", era:"",
  story:["오스트리아 남쪽 케른텐 지방으로 가던 옛 길이라는 뜻이에요. 오페라극장에서 성 슈테판 대성당까지 이어지는 비엔나 최대 보행자 쇼핑 거리예요."],
  look:[], tip:"마너(Manner) 웨하스, 모차르트 초콜릿(모차르트쿠겔)이 대표 기념품이에요."},
 {id:"sacher", city:"vie", o:["Café Sacher Wien"], name:"카페 자허 · 자허토르테", era:"1832년",
  story:["1832년, 재상 메테르니히가 손님 대접용 특별 디저트를 주문했는데 요리장이 아파서 **16살 견습생 프란츠 자허**가 대신 만든 케이크가 자허토르테예요. 진한 초콜릿 케이크 사이에 살구잼을 바르고 겉을 초콜릿으로 감쌌어요.","그의 아들이 세운 호텔 자허에서 지금도 비밀 레시피로 만들어요. 데멜과의 '원조 논쟁' 끝에 '오리지널 자허토르테'라는 이름은 이곳만 쓸 수 있게 되었어요."],
  look:["케이크 위에 찍힌 초콜릿 도장"], tip:"설탕을 넣지 않은 휘핑크림(Schlagobers)을 꼭 곁들여 먹어요. 너무 달지 않게 균형을 맞춰 줘요."},
 /* ---------------- Budapest ---------------- */
 {id:"budacastle", city:"bud", o:["Buda Castle"], name:"부다 왕궁", era:"13세기~",
  story:["1241년 몽골 침입을 겪은 뒤 벨러 4세 왕이 방어를 위해 언덕 위에 성을 쌓은 게 시작이에요. 15세기 마차시 왕 때는 유럽에서 손꼽히는 르네상스 궁전이었어요.","그 뒤 오스만 점령, 1686년 탈환 전투, 2차 세계대전 포위전으로 몇 번이나 부서지고 다시 지어졌어요. 지금은 헝가리 국립미술관과 부다페스트 역사박물관으로 쓰여요."],
  look:["투룰 새 조각: 헝가리 건국 신화에 나오는 전설의 매","왕궁 테라스에서 보는 다뉴브강과 페스트 쪽 전망","1870년에 만든 언덕 푸니쿨라"], tip:"힐튼 호텔에서 걸어서 갈 수 있어요. 왕궁 테라스는 무료로 들어갈 수 있어요."},
 {id:"bastion", city:"bud", o:["Fisherman's Bastion"], name:"어부의 요새", era:"1895–1902년",
  story:["중세 성처럼 생겼지만, 사실 1896년 헝가리 건국 천 년을 기념해 지은 전망대예요. 하얀 고깔 탑 7개는 896년 이 땅에 정착한 마자르 **7개 부족**을 뜻해요.","**'어부의 요새'라는 이름**은 중세에 이 구간 성벽을 어부 조합이 지켰다는 데서 왔어요."],
  look:["탑 사이 아치 창으로 보는 국회의사당","성 이슈트반 1세 기마상"], tip:"아래쪽 테라스는 무료, 위쪽 일부 구간은 낮에 유료예요. 저녁엔 무료로 개방되는 경우가 많아요."},
 {id:"matthias", city:"bud", o:["Matthias Church Budapest"], name:"마차시 성당", era:"13세기~",
  story:["정식 이름은 성모 마리아 성당인데, 마차시 왕이 여기서 두 번 결혼식을 올려 '마차시 성당'으로 불려요. 오스만 지배 때는 모스크로 쓰였어요.","1867년 프란츠 요제프 황제와 시시가 헝가리 국왕·왕비로 대관식을 올린 곳이에요. 이때 작곡가 리스트가 대관 미사곡을 썼어요."],
  look:["헝가리 졸너이 도자기 타일로 덮인 알록달록한 지붕","성당 안의 금빛 벽화"], tip:"성당 안은 유료예요. 지붕은 밖에서 보는 게 더 예뻐요."},
 {id:"chimney", city:"bud", o:["Chimney Cake Shop Budapest Castle"], name:"굴뚝빵(퀴르퇴슈칼라치)", era:"",
  story:["트란실바니아(지금의 루마니아 지역)에 사는 헝가리계 사람들의 전통 빵이에요. 반죽을 나무 막대에 감아 숯불 위에서 돌리며 굽고, 설탕이 녹아 겉이 캐러멜처럼 바삭해져요. 김이 굴뚝처럼 올라와서 '굴뚝빵'이라고 불려요."],
  look:[], tip:"프라하에서 먹은 뜨르들로와 비교해 보세요. 기본 시나몬 설탕 맛을 추천해요."},
 {id:"sunset", city:"bud", o:["Batthyány tér Budapest","Batthyány tér"], name:"다뉴브 강변 · 국회의사당 야경", era:"",
  story:["부다 쪽 바찌아니 광장 앞 강변은 **국회의사당이 정면으로 가장 크고 멋지게 보이는 자리**예요. 해가 지고 국회의사당에 금빛 조명이 켜지는 순간이 **이번 여행의 하이라이트**예요.","다뉴브강은 독일에서 시작해 오스트리아, 슬로바키아, 헝가리 등 10개 나라를 지나 흑해로 흘러가요."],
  look:["해 진 직후, 하늘이 파랗게 남아 있는 '블루 아워'의 국회의사당"], tip:"10월 초 일몰은 오후 6시 20분 전후예요. 조명은 해가 진 뒤에 켜져요. 강바람이 차니 겉옷을 챙기세요."},
 {id:"lanchid", city:"bud", o:["Lánchíd Söröző Budapest"], name:"란치드 쇠뢰죄 · 굴라시", era:"",
  story:["세체니 다리 부다 쪽 끝 근처의 펍이에요. '쇠뢰죄'는 헝가리어로 맥줏집이라는 뜻이에요.","헝가리 원조 굴라시(gulyás)는 스튜가 아니라 파프리카로 맛을 낸 수프예요. 원래 소 치는 목동(구야시)들이 들판에서 끓여 먹던 음식이라 이런 이름이 붙었어요. 체코와 오스트리아의 굴라시는 걸쭉한 스튜 형태라, 세 나라 굴라시를 비교해 보는 것도 재밌어요."],
  look:[], tip:"헝가리 파프리카는 맵지 않은 단맛(édes)과 매운맛(csípős)이 있어요."},
 {id:"hilton", city:"bud", o:["Hilton Budapest","Hilton Budapest Hess András tér"], name:"힐튼 부다페스트", era:"1976년 개관",
  story:["그냥 호텔이 아니라 유적 위에 지은 호텔이에요. 13세기 도미니크회 수도원 성당의 탑과 17세기 예수회 건물의 벽이 호텔 건물 안에 그대로 이어져 있어요. 어부의 요새와 마차시 성당 바로 옆이라 위치가 최고예요."],
  look:["호텔 옆에 붙은 중세 탑의 흔적"], tip:"체크인 전에도 짐을 맡기고 바로 관광을 시작할 수 있어요."},
 {id:"nyc", city:"bud", o:["New York Café Budapest"], name:"뉴욕 카페", era:"1894년",
  story:["미국 뉴욕 생명보험 회사 건물 1층에 1894년 문을 연 카페예요. 금빛 기둥과 천장 벽화 때문에 '세계에서 가장 아름다운 카페'로 자주 꼽혀요.","20세기 초 헝가리 작가와 편집자들의 아지트였어요. 개업 날 작가들이 '이 카페는 절대 문을 닫지 말라'며 열쇠를 다뉴브강에 던졌다는 전설도 있어요."],
  look:["고개를 들어 천장 벽화와 샹들리에를 보세요."], tip:"대기 줄이 길어서 예약을 추천해요. 가격은 부다페스트 평균보다 꽤 비싸요."},
 {id:"basilica", city:"bud", o:["St. Stephen's Basilica Budapest"], name:"성 이슈트반 대성당", era:"1851–1905년",
  story:["짓는 데 54년이 걸린 부다페스트 최대의 성당이에요. 중간에 돔이 무너져서 다시 짓기도 했어요. 높이는 96m로 국회의사당과 똑같은데, 건국 연도 896년을 뜻해요. 부다페스트에서는 이보다 높은 건물을 짓지 못하게 해서 스카이라인이 낮고 아름다워요.","헝가리 첫 국왕 성 이슈트반의 오른손이 '**신성한 오른손**(Szent Jobb)'이라는 이름으로 이곳에 보관되어 있어요."],
  look:["성 이슈트반의 오른손 유물(성당 왼쪽 뒤 예배당)","돔 전망대에서 보는 부다페스트 전경"], tip:"돔 전망대는 엘리베이터와 계단으로 올라가요."},
 {id:"chain", city:"bud", o:["Széchenyi Chain Bridge"], name:"세체니 다리", era:"1849년 개통",
  story:["부다와 페스트를 잇는 첫 번째 상설 다리예요. 세체니 이슈트반 백작이 아버지 장례식에 가려다 강이 얼고 배가 없어 며칠을 기다린 뒤, 다리를 놓기로 결심했다는 이야기가 있어요. 영국 기술자들이 설계하고 지었어요.","다리 양 끝 사자상에는 '혀가 없다'는 전설이 있어요. 실은 **혀가 있는데 아래에서는 안 보이는 거예요**. 1945년 독일군이 후퇴하며 폭파했고, 1949년 다리 개통 100주년에 맞춰 다시 열었어요."],
  look:["사자상 입 속(혀가 있는지 확인해 보세요)","밤에 전구처럼 빛나는 다리 줄"], tip:"걸어서 건너는 데 10분 정도 걸려요. 부다 왕궁과 국회의사당이 모두 보여요."},
 {id:"parliament_hu", city:"bud", o:["Hungarian Parliament Building"], name:"헝가리 국회의사당", era:"1885–1904년",
  story:["헝가리에서 가장 큰 건물로, 길이가 약 268m예요. 런던 국회의사당에서 영감을 받은 네오고딕 양식이에요. 돔 높이 96m는 역시 건국 연도 896년을 뜻해요.","안에는 헝가리 역대 왕들이 대관식 때 쓴 '신성 왕관'이 보관돼 있어요. 2차 세계대전 뒤 미국에 넘어가 있다가 1978년에 돌아왔어요. 가이드 투어로만 안을 볼 수 있어요."],
  look:["강 건너 부다 쪽에서 보는 정면","건물 앞 코슈트 광장"], tip:"이번 일정은 외관 위주예요. 내부 투어는 미리 예약해야 해요."},
 {id:"shoes", city:"bud", o:["Shoes on the Danube Bank"], name:"다뉴브 강변의 신발들", era:"2005년 설치",

// 가까운 아이콘끼리 겹치지 않게 살짝 밀어내기
function declutter(){
  if (!map || state.day===0) return;
  const items = markers.map((m,i)=>m?{m,i,p:map.latLngToLayerPoint(m.getLatLng()),dx:0,dy:0}:null).filter(Boolean);
  const R = 50;
  for (let it=0; it<40; it++) {
    for (let a=0;a<items.length;a++) for (let b=a+1;b<items.length;b++){
      const A=items[a],B=items[b]; let vx=(B.p.x+B.dx)-(A.p.x+A.dx), vy=(B.p.y+B.dy)-(A.p.y+A.dy);
      let d=Math.hypot(vx,vy); if (d>=R) continue; if (d<0.01){ vx=Math.cos(a+b); vy=Math.sin(a+b); d=1; }
      const push=(R-d)/2; vx/=d; vy/=d; A.dx-=vx*push; A.dy-=vy*push; B.dx+=vx*push; B.dy+=vy*push;
    }
  }
  items.forEach(o=>{ const el=o.m.getElement(); const sp=el&&el.querySelector(".sp"); if(!sp) return;
    sp.style.setProperty("--dx", Math.round(o.dx)+"px"); sp.style.setProperty("--dy", Math.round(o.dy)+"px"); });
}
function refreshPins(){
  if (!map || state.day===0) return;
  const d = DAYS[state.day-1]; let n=0;
  d.stops.forEach((s,i)=>{ if(!s.ll) return; n++; const m=markers[i]; if(!m) return;
    m.setIcon(spotIcon(d,s,n,state.sel===i)); m.setZIndexOffset(state.sel===i?1000:n); });
  declutter();
}

/* ================= sheet (mobile drag) ================= */
let sheetY = 0;
function snaps(){ const h=$("#sheet").offsetHeight; const top=$(".top").offsetHeight; return {full:Math.max(0, top-58), half:Math.round(h*0.46), peek:Math.max(0,h-150)}; }
function setSheet(pos, y){
  const sh=$("#sheet"); const s=snaps();
  sheetY = y ?? s[pos]; sh.style.setProperty("--y", sheetY+"px"); sh.dataset.pos = pos || "";
}
function setListMode(on){
  const app=$(".app"); app.classList.toggle("listmode", on);
  app.style.setProperty("--toph", $(".top").offsetHeight+"px");
  const vt=$("#viewToggle"); vt.innerHTML = on ? "🗺️ 지도" : "📄 목록"; vt.setAttribute("aria-pressed", on); vt.title = on ? "지도와 함께 보기" : "목록만 크게 보기";
  if (!on) { if (!isDesktop()) setSheet("half"); if (map) setTimeout(()=>{ map.invalidateSize(); if(state.tab==="plan") drawMap(); }, 60); }
}
function toggleView(){ setListMode(!$(".app").classList.contains("listmode")); }
$("#viewToggle").addEventListener("click", e=>{ e.stopPropagation(); toggleView(); });
(function(){
  const grab=$("#grab"), sh=$("#sheet"); let startY=0, startSheet=0, dragging=false, moved=false, t0=0;
  grab.addEventListener("pointerdown", e => { if (isDesktop()) return;
    dragging=true; moved=false; startY=e.clientY; startSheet=sheetY; t0=performance.now(); });
  grab.addEventListener("pointermove", e => { if(!dragging) return; const dy=e.clientY-startY;
    if (!moved && Math.abs(dy)>6) { moved=true; sh.classList.add("dragging"); try{grab.setPointerCapture(e.pointerId)}catch{} }
    if (!moved) return;
    const s=snaps(); sheetY=Math.min(s.peek, Math.max(s.full,startSheet+dy)); sh.style.setProperty("--y", sheetY+"px"); });
  const end = e => { if(!dragging) return; dragging=false; sh.classList.remove("dragging");
    if(!moved){ return; }
    const s=snaps(); const v=(e.clientY-startY)/Math.max(1,performance.now()-t0);
    let pos; if (v>0.6) pos = sheetY < s.half ? "half" : "peek"; else if (v<-0.6) pos = sheetY > s.half ? "half" : "full";
    else pos = Object.entries(s).sort((a,b)=>Math.abs(a[1]-sheetY)-Math.abs(b[1]-sheetY))[0][0];
    setSheet(pos); };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
  $(".handle").addEventListener("click", ()=>{ if(isDesktop())return; setSheet(sh.dataset.pos==="peek"?"half":sh.dataset.pos==="half"?"full":"peek"); });
  addEventListener("resize", () => { setSheet(sh.dataset.pos || "half"); $(".app").style.setProperty("--toph", $(".top").offsetHeight+"px"); });
})();

    const today = i===todayIdx ? '<span class="today">오늘</span>' : '';
    chips.push(`<button class="chip" data-day="${i+1}" aria-pressed="${state.day===i+1}" style="--c:${colorOf(d.city==="aus"?"vie":d.city)}"><span class="d">Day${i+1} · ${m} ${d.wd}</span><span class="t">${esc(CITY[d.city].name)}${today}</span></button>`);

/* ================= vouchers (IndexedDB, this device only) ================= */
const DB = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ try{
      const r=indexedDB.open("eurotrip-vouchers",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});
      r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error);
    }catch(e){rej(e)} }); },
  async tx(mode, fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("files",mode); const st=t.objectStore("files"); const out=fn(st); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); }); },
  all(){ return this.tx("readonly", st=>st.getAll()); },
  put(rec){ return this.tx("readwrite", st=>st.put(rec)); },
  del(id){ return this.tx("readwrite", st=>st.delete(id)); },
  get(id){ return this.tx("readonly", st=>st.get(id)); }
};
let fileCache = [], dbOK = true;

/* ---------- Google Drive 연동 (클라이언트 ID가 있을 때만) ---------- */
const GD = {
  token:null, exp:0, files:null, busy:"", err:"", client:null,
  on(){ return !!GOOGLE_CLIENT_ID && !!DRIVE.folderId; },
  valid(){ return !!this.token && Date.now() < this.exp - 60e3; },
  restore(){ // 새로고침해도 로그인·목록 유지 (토큰은 약 1시간 유효)
    const t = store.get("gd_tok", null); if (t && t.exp > Date.now() + 60e3) { this.token=t.t; this.exp=t.exp; }
    const f = store.get("gd_files", null); if (Array.isArray(f)) this.files = f;
  },
  save(){ store.set("gd_tok", this.token ? {t:this.token, exp:this.exp} : null); },
  loadGIS(){ return window.google?.accounts?.oauth2 ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.onload=res; s.onerror=()=>rej(new Error("구글 로그인 스크립트를 불러오지 못했어요")); document.head.appendChild(s); }); },
  async login(){
    await this.loadGIS();
    return new Promise((res,rej)=>{
      this.client = google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:"https://www.googleapis.com/auth/drive",
        login_hint: store.get("gd_hint", undefined),
        callback:r=>{ if(r.error) return rej(new Error(r.error_description||r.error)); this.token=r.access_token; this.exp=Date.now()+(+r.expires_in||3600)*1000; this.save(); store.set("gd_used", true); res(); },
        error_callback:e=>rej(new Error(e.type==="popup_closed"?"로그인 창이 닫혔어요":e.type==="popup_failed_to_open"?"팝업이 차단됐어요. 다시 눌러주세요.":"로그인하지 못했어요"))});
      this.client.requestAccessToken({prompt:""});
    });
  },
  logout(){ try { if (this.token) google.accounts.oauth2.revoke(this.token, ()=>{}); } catch {} this.token=null; this.exp=0; this.files=null; this.save(); store.set("gd_files", null); store.set("gd_used", false); },
  async ensure(){ if(!this.valid()) await this.login(); },
  async api(url, opt={}){
    await this.ensure();
    const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:`Bearer ${this.token}`}});
    if (r.status===401){ this.token=null; this.save(); throw new Error("로그인이 만료됐어요. 다시 연결해 주세요."); }
    if (!r.ok){ let m=""; try{ m=(await r.json()).error.message }catch{} throw new Error(m||`드라이브 오류 (${r.status})`); }
    return r;
  },
  async list(){
    const q = enc(`'${DRIVE.folderId}' in parents and trashed=false`);
    const r = await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=200&fields=files(id,name,mimeType,modifiedTime,webViewLink,appProperties)&supportsAllDrives=true&includeItemsFromAllDrives=true`);
    this.files = (await r.json()).files || [];
    store.set("gd_files", this.files);
    try { const a = await this.api("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)"); const u=(await a.json()).user; if (u&&u.emailAddress) store.set("gd_hint", u.emailAddress); } catch {}
  },
  async upload(file, bid, title){
    const meta = {name: title ? `[${title}] ${file.name}` : file.name, parents:[DRIVE.folderId], appProperties: bid?{bid}:{}};
    const fd = new FormData();
    fd.append("metadata", new Blob([JSON.stringify(meta)], {type:"application/json"}));
    fd.append("file", file);
    const r = await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id", {method:"POST", body:fd});
    return (await r.json()).id;
  },
  async blob(id){ const r = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media&supportsAllDrives=true`); return r.blob(); }
};

  el.querySelectorAll("[data-fgo]").forEach(b=>b.onclick=()=>{ const [d,i]=b.dataset.fgo.split(":").map(Number); setDay(d); setTimeout(()=>select(i,true),300); });
  const lg=$("#gdLogin"); if (lg) lg.onclick=()=>gdRun("구글 로그인 중…", async()=>{ await GD.login(); await GD.list(); });
  const lo=$("#gdLogout"); if (lo) lo.onclick=()=>{ GD.logout(); renderBookKeep(); };
  const rf=$("#gdRefresh"); if (rf) rf.onclick=()=>gdRun("목록 불러오는 중…", ()=>GD.list());
  const up=$("#gdUp"); if (up) up.onchange=()=>{ const fs=[...up.files]; gdRun(`${fs.length}개 올리는 중…`, async()=>{ for(const f of fs) await GD.upload(f); await GD.list(); }); };
  el.querySelectorAll("[data-gsave]").forEach(b=>b.onclick=()=>gdRun("기기에 저장하는 중…", async()=>{
    const f=GD.files.find(x=>x.id===b.dataset.gsave); const blob=await GD.blob(f.id);
    try { await navigator.storage?.persist?.(); } catch {}
    await DB.put({id:`drv-${f.id}`, driveId:f.id, bid:bidOf(f)||"etc", name:f.name, type:f.mimeType, blob, added:Date.now()});
    await loadFiles();
  }));
  el.querySelectorAll("input[data-up]").forEach(inp=>inp.onchange=async()=>{
    const bid=inp.dataset.up; const fs=[...inp.files]; const recs=[];
    try { await navigator.storage?.persist?.(); } catch {}
    for (const f of fs){ const rec={id:`${bid}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, bid, name:f.name, type:f.type, blob:f, added:Date.now()}; try{ await DB.put(rec); recs.push(rec); }catch{} }
    await loadFiles(); renderBookKeep();
    if (GD.valid()) gdRun("드라이브에도 올리는 중…", async()=>{
      for (const rec of recs){ const id = await GD.upload(rec.blob, bid, bookTitle(bid)); rec.driveId=id; try{ await DB.put(rec); }catch{} }
      await loadFiles(); await GD.list();

    if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent="정말 삭제"; setTimeout(()=>{ b.classList.remove("confirm"); b.textContent="삭제"; },3000); return; }
    await DB.del(b.dataset.del); await loadFiles(); renderBook();
  });
  bindCopy(el);
}
function bindCopy(el){
  el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent="복사됨"; }
    catch { const r=document.createRange(); r.selectNodeContents(b.parentElement); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="선택됨"; }
    setTimeout(()=>b.textContent="복사",1500);
  });
}
let pdfReady=null;
function loadPdfJs(){
  if (pdfReady) return pdfReady;
  const add = src => new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/";
  pdfReady = add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).then(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js"; return pdfjsLib; });
  pdfReady.catch(()=>{ pdfReady=null; });
  return pdfReady;
}
let objURL=null;
async function openFile(id){
  const f = fileCache.find(x=>x.id===id); if(!f) return;
  const v=$("#viewer"), body=$("#vbody"); $("#vname").textContent=f.name; v.hidden=false; body.innerHTML='<div class="msg">여는 중…</div>';
  if (objURL) URL.revokeObjectURL(objURL);
  objURL = URL.createObjectURL(f.blob);
  if ((f.type||"").startsWith("image/")) { body.innerHTML=`<img src="${objURL}" alt="${esc(f.name)}">`; return; }
  try {
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({data: new Uint8Array(await f.blob.arrayBuffer())}).promise;
    body.innerHTML="";
    const w = Math.min(body.clientWidth-20, 900);
    for (let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p); const vp0 = page.getViewport({scale:1});
      const scale = (w/vp0.width) * (window.devicePixelRatio||1);
      const vp = page.getViewport({scale}); const cv=document.createElement("canvas");
      cv.width=vp.width; cv.height=vp.height; cv.style.width=Math.round(vp.width/(window.devicePixelRatio||1))+"px";
      body.appendChild(cv); await page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
    }
  } catch { body.innerHTML='<div class="msg">PDF를 표시하지 못했어요. 인터넷에 연결된 상태에서 한 번 열어 두면 이후엔 오프라인에서도 열려요.</div>'; }
}

const GLOSS_RE = new RegExp(GLOSS.map(([t])=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
const GLOSS_Q = Object.fromEntries(GLOSS);
const Q_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';
function rich(text){
  let h = esc(text).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
  const used = new Set();
  // 태그 밖의 글자에만 용어·연도 표시
  h = h.split(/(<[^>]+>)/).map(seg=>{
    if (seg.startsWith("<")) return seg;
    seg = seg.replace(GLOSS_RE, m=>{ if (used.has(m)) return m; used.add(m);
      return `<span class="term">${m}<a class="q" href="https://www.google.com/search?q=${enc(GLOSS_Q[m])}" target="_blank" rel="noopener" aria-label="${m} 검색">${Q_ICON}</a></span>`; });
    return seg;
  }).join("");
  h = h.split(/(<[^>]+>)/).map(seg=> seg.startsWith("<") ? seg :
    seg.replace(/(기원전\s?)?(\d{3,4}(–\d{2,4})?년|\d{1,2}(–\d{1,2})?세기)(경)?(?!\s?(동안|간|만에|넘게|가까이)|이\s?걸)/g, m=>`<span class="yr">${m}</span>`)).join("");
  return h;
}

const IMG = {};
// 위키미디어는 정해진 크기(330/500/960/1280…)만 허용해서 960px로 요청해요
function artSrc(t){
  if (IMG[t]) return Promise.resolve(IMG[t]);
  const c = store.get("img3:"+t, null); if (c) { IMG[t]=c; return Promise.resolve(c); }
  return fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t)).then(r=>r.json()).then(j=>{
    let src = (j.thumbnail && j.thumbnail.source) || (j.originalimage && j.originalimage.source);
    if (!src) throw new Error("no image");
    src = src.replace(/\/\d+px-/, "/960px-");
    IMG[t]=src; store.set("img3:"+t, src); return src;
  });
}
function loadArtImg(img){
  const t = img.dataset.wiki; if (!t || img.dataset.state) return;
  img.dataset.state = "loading";
  artSrc(t).then(src=>{
    img.onload = ()=>{ img.dataset.state="ok"; };
    img.onerror = ()=>{ // 캐시된 주소가 막혔으면 한 번 새로 받아요
      if (img.dataset.retry) { img.dataset.state="fail"; return; }
      img.dataset.retry="1"; delete IMG[t]; store.set("img3:"+t, null);
      artSrc(t).then(s2=>{ img.src=s2; }).catch(()=>{ img.dataset.state="fail"; });
    };
    img.src = src;
  }).catch(()=>{ img.dataset.state="fail"; });
}
function hydrateArt(root){
  // 이미지 주소만 먼저 받아두고, 실제 다운로드는 브라우저의 지연 로딩에 맡겨요
  root.querySelectorAll("img[data-wiki]:not([data-state])").forEach(loadArtImg);
}
// 전시실 한 줄: 작은 액자 썸네일 → 누르면 전체 화면 감상 모드
const ART_FIRST = 5; // 첫 번째로 보이는 전시(날짜순 첫 번째: 프라하성)

    <div class="gal-row">${a.items.map((w,k)=>`
      <button class="gal-tile" data-artv="${vi}:${k}" aria-label="${esc(w.ko)} 크게 보기">
