}
/* ---------- 감상 모드 (스토리처럼 넘기기) ---------- */
const AV = {v:0, k:0};
function openArt(v,k){ AV.v=v; AV.k=k; $("#artv").hidden=false; document.body.classList.add("noscroll"); drawArt(); }
function closeArt(){ $("#artv").hidden=true; document.body.classList.remove("noscroll"); }
function stepArt(d){
  const a=ART[AV.v]; let k=AV.k+d, v=AV.v;
  if (k>=a.items.length){ v=(v+1)%ART.length; k=0; } else if (k<0){ v=(v-1+ART.length)%ART.length; k=ART[v].items.length-1; }
  AV.v=v; AV.k=k; drawArt();
}
function drawArt(){
  const a=ART[AV.v], w=a.items[AV.k], root=$("#artv");
  root.style.setProperty("--c", `var(${CITY[a.city].color})`);
  $("#avBars").innerHTML = a.items.map((_,i)=>`<i class="${i<AV.k?'done':i===AV.k?'on':''}"></i>`).join("");
  $("#avVenue").textContent = `${a.venue} · Day${a.day}`;
  const img=$("#avImg"); img.removeAttribute("data-state"); img.removeAttribute("data-retry"); img.removeAttribute("src");
  img.dataset.wiki=w.wiki; img.alt=w.ko; loadArtImg(img);
  $("#avText").innerHTML = `
    <div class="av-count">${AV.k+1} / ${a.items.length}</div>
    <h2>${esc(w.ko)}</h2>
    <div class="av-meta">${rich(w.artist)} · <span class="yr">${esc(w.year)}</span></div>
    <div class="av-en">${esc(w.en)}</div>
    <p>${rich(w.desc)}</p>
    <div class="av-box"><div class="st-k">👀 이렇게 보세요</div><ul>${w.look.map(x=>`<li>${rich(x)}</li>`).join("")}</ul></div>
    <div class="av-box bio"><div class="st-k">🎨 ${esc(w.artist)}</div><p>${rich(w.bio)}</p></div>
    <a class="art-src" href="https://en.wikipedia.org/wiki/${enc(w.wiki)}" target="_blank" rel="noopener">이미지: Wikimedia Commons · 위키백과</a>`;
  $("#avText").scrollTop=0;
  // 다음 그림 미리 받아두기
  const nx = a.items[AV.k+1]; if (nx) artSrc(nx.wiki).then(s=>{ const i=new Image(); i.src=s; }).catch(()=>{});
}
function bindArtTiles(root){ root.querySelectorAll("[data-artv]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [v,k]=b.dataset.artv.split(":").map(Number); openArt(v,k); }); }

const PH_SKIP = /map|karte|logo|coat[_ ]of[_ ]arms|wappen|flag|locator|location|plan|diagram|signature|seal|icon|\.svg|\.png|\.gif|\.tif|chart|graph|drawing|illustration|cuts|scheme|schema|engraving|lithograph|stamp|poster|menu card|label/i;
const PH_MEM = {};
const whost = u => (u.startsWith("//") ? "https:" + u : u).replace(/\?.*$/,"");
async function mediaFor(title){
  const key = "ph3:"+title;
  const c = store.get(key, null); if (Array.isArray(c)) return c;
  const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/"+encodeURIComponent(title));
  if (!r.ok) throw new Error("no page");
  const j = await r.json();
  const out = (j.items||[]).filter(it=>it.type==="image" && it.showInGallery!==false && it.srcset && it.srcset.length && !PH_SKIP.test(it.title||""))
    .slice(0,3).map(it=>whost(it.srcset[0].src));
  store.set(key, out); return out;
}
async function commonsFor(q){
  const key = "phc2:"+q;
  const c = store.get(key, null); if (Array.isArray(c)) return c;
  const u = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=960&gsrsearch="+encodeURIComponent(q+" filetype:bitmap");
  const j = await (await fetch(u)).json();
  const pages = Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));
  const out = pages.filter(p=>!PH_SKIP.test(p.title||"") && p.imageinfo && p.imageinfo[0] && (p.imageinfo[0].thumburl||p.imageinfo[0].url)).slice(0,3)
    .map(p=>whost(p.imageinfo[0].thumburl||p.imageinfo[0].url));
  store.set(key, out); return out;
}
async function leadFor(title){ // 위키백과 문서의 대표 사진 1장
  const key = "phs1:"+title; const c = store.get(key, null); if (Array.isArray(c)) return c;
  const j = await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title))).json();
  const u = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source);
  const out = u ? [whost(u)] : []; store.set(key, out); return out;
}
async function photosFor(id){
  if (PH_MEM[id]) return PH_MEM[id];
  const list = []; let t = null;
  for (const src of (PHOTO[id]||[])) {
    if (list.length >= 3) break;
    try {
      const l = src.startsWith("c:") ? await commonsFor(src.slice(2)) : src.startsWith("s:") ? await leadFor(src.slice(2)) : await mediaFor(src);
      for (const u of l) if (list.length < 3 && !list.includes(u)) list.push(u);
      if (!t && l.length && !src.startsWith("c:") && !src.startsWith("s:")) t = src;
    } catch {}
  }
  if (!list.length) for (const src of (PHOTO[id]||[]).filter(x=>!x.startsWith("c:")&&!x.startsWith("s:"))) { try {
      const j = await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(src))).json();
      const u = j.thumbnail && j.thumbnail.source; if (u) { list.push(whost(u)); t = src; break; } } catch {} }
  PH_MEM[id] = {list, t}; return PH_MEM[id];
}
// 위키미디어가 허용하는 표준 크기로 바꿔서 시도 (960 → 500 → 330 → 원본)
function sizes(u){
  const m = u.match(/\/(\d+)px-[^/]+$/);
  if (!m) return [u];
  const orig = u.replace("/thumb/","/").replace(/\/\d+px-[^/]+$/,"");
  return [960,500,330].map(w=>u.replace(/\/\d+px-/,`/${w}px-`)).concat([orig]);
}
function setImg(img, u){
  const c = sizes(u); let i = 0;
  img.onerror = ()=>{ i++; if (i < c.length) img.src = c[i]; else img.closest(".ph-s")?.remove(); };
  img.onload = ()=>{ img.dataset.state = "ok"; };
  img.src = c[0];
}
function photoSlot(id, q){ return PHOTO[id] ? `<div class="ph" data-ph="${id}" data-q="${esc(q||"")}"><div class="ph-track"><div class="ph-s ph-skel"></div></div></div>` : ""; }
const gImg = q => `https://www.google.com/search?tbm=isch&q=${enc(q)}`;
function hydratePhotos(root){
  root.querySelectorAll(".ph[data-ph]:not([data-done])").forEach(async box=>{
    box.dataset.done = "1";
    const {list, t} = await photosFor(box.dataset.ph);
    const q = box.dataset.q;
    if (!list.length) { box.innerHTML = q ? `<a class="btn sm ph-g" href="${gImg(q)}" target="_blank" rel="noopener">📷 구글에서 사진 보기</a>` : ""; return; }
    const tr = box.querySelector(".ph-track");
    tr.innerHTML = list.map((u,k)=>`<div class="ph-s"><img alt="" loading="lazy" decoding="async"><span class="ph-n">${k+1}/${list.length}</span></div>`).join("");
    tr.querySelectorAll("img").forEach((im,k)=>setImg(im, list[k]));
    box.insertAdjacentHTML("beforeend", `<div class="ph-foot"><a class="ph-cr" href="${t?`https://en.wikipedia.org/wiki/${enc(t)}`:"https://commons.wikimedia.org"}" target="_blank" rel="noopener">사진: Wikimedia Commons${list.length>1?" · 옆으로 넘겨보기 →":""}</a>${q?`<a class="ph-more" href="${gImg(q)}" target="_blank" rel="noopener">📷 구글 사진 더 보기</a>`:""}</div>`);
  });
}

      <a class="btn sm" href="${gPlace(st.o[0])}" target="_blank" rel="noopener">${IC.pin}구글맵</a>
      ${w?`<button class="btn sm" data-goto="${w.day}:${w.i}">${IC.route}일정 Day${w.day}에서 보기</button>`:""}

}
const NAME_IMG = {"합스부르크 가문":"Schönbrunn_Palace","마리아 테레지아":"Maria_Theresa","프란츠 요제프 1세":"Franz_Joseph_I_of_Austria","엘리자베트(시시)":"Empress_Elisabeth_of_Austria","카를 4세":"Charles_IV,_Holy_Roman_Emperor","이슈트반 1세":"Stephen_I_of_Hungary"};
const COUNTRY_IMG = {cz:["Prague_Castle","🏰 블타바강 위의 프라하성"], at:["Schönbrunn_Palace","👑 합스부르크의 여름 궁전, 쇤브룬"], hu:["Fisherman's_Bastion","🏯 부다 언덕의 어부의 요새"]};
/* ================= '먼저 읽어요' 그림 (그림 지도 미니 버전) ================= */
function miniMap(kind){
  const B = {w:12.2, e:20.4, n:51.1, s:46.3}, K = 58, KY = K*1.47;
  const X = lon => ((lon-B.w)*K).toFixed(1), Y = lat => ((B.n-lat)*KY).toFixed(1);
  const W = ((B.e-B.w)*K).toFixed(0), H = ((B.n-B.s)*KY).toFixed(0);
  const path = ring => "M"+ring.map(([x,y])=>X(x)+","+Y(y)).join("L")+"Z";
  const line = pts => "M"+pts.map(([la,lo])=>X(lo)+","+Y(la)).join("L");
  const lands = COUNTRIES.features.map(f=>{ const id=f.properties.id; const cls=["cz","at","hu"].includes(id)?id:"etc";
    return `<path class="land land-${cls}" d="${f.geometry.coordinates.map(pl=>pl.map(path).join("")).join("")}" stroke-width="1.6"/>`; }).join("");
  const rivers = [RIVERS.danube, RIVERS.vltava].map(r=>`<path d="${line(r)}" class="river-bank" fill="none" stroke-width="${kind==="rivers"?11:7}" stroke-linecap="round" stroke-linejoin="round"/><path d="${line(r)}" class="river" fill="none" stroke-width="${kind==="rivers"?6:3.5}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  let extra = "";
  if (kind === "flags") {
    const curtain = [[48.6,13.8],[48.77,14.7],[48.96,15.0],[48.8,15.9],[48.62,16.9],[48.0,17.1],[47.7,16.8],[47.45,16.5],[47.0,16.35],[46.75,16.15]];
    extra += `<path d="${line(curtain)}" fill="none" stroke="#D0453A" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`;
    extra += `<text x="${X(16.55)}" y="${Y(49.35)}" class="mm-note">냉전 시절 '철의 장막'</text>`;
    [["🇨🇿","체코",15.2,49.95],["🇦🇹","오스트리아",14.6,47.75],["🇭🇺","헝가리",19.3,47.2]].forEach(([f,n,lo,la])=>{
      extra += `<g class="mm-pin"><line x1="${X(lo)}" y1="${Y(la)}" x2="${X(lo)}" y2="${(+Y(la)-34).toFixed(1)}" stroke="currentColor" stroke-width="2"/><circle cx="${X(lo)}" cy="${Y(la)}" r="4" fill="currentColor"/>
        <text x="${(+X(lo)+2).toFixed(1)}" y="${(+Y(la)-30).toFixed(1)}" class="mm-flag">${f}</text><text x="${X(lo)}" y="${(+Y(la)+20).toFixed(1)}" class="mm-name" text-anchor="middle">${n}</text></g>`;
    });
    extra += `<text x="${X(17.3)}" y="${Y(50.85)}" class="mm-note soft" text-anchor="middle">폴란드</text><text x="${X(13.0)}" y="${Y(49.6)}" class="mm-note soft">독일</text><text x="${X(18.6)}" y="${Y(48.75)}" class="mm-note soft">슬로바키아</text>`;
  } else {
    [["프라하",14.42,50.087,"🏰"],["비엔나",16.373,48.208,"🎻"],["부다페스트",19.045,47.5,"🏛️"]].forEach(([n,lo,la,e])=>{
      extra += `<circle cx="${X(lo)}" cy="${Y(la)}" r="15" class="mm-dot"/><text x="${X(lo)}" y="${(+Y(la)+6).toFixed(1)}" text-anchor="middle" font-size="16">${e}</text><text x="${X(lo)}" y="${(+Y(la)+34).toFixed(1)}" text-anchor="middle" class="mm-name">${n}</text>`;
    });
    extra += `<text x="${X(13.3)}" y="${Y(49.25)}" class="mm-river">블타바강</text><text x="${X(17.1)}" y="${Y(48.4)}" class="mm-river">다뉴브강</text><text x="${X(18.85)}" y="${Y(46.75)}" class="mm-river">↓ 흑해로</text>`;
  }
  return `<svg class="mini-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==="flags"?"체코·오스트리아·헝가리 위치 지도":"블타바강과 다뉴브강, 세 도시 위치"}"><rect width="${W}" height="${H}" class="mm-sea"/>${lands}${rivers}${extra}</svg>`;
}
function miniTimeline(){
  const st = [["🏰","프라하","중세 · 보헤미아 왕국","--prg"],["👑","비엔나","합스부르크 제국의 절정","--vie"],["🏛️","부다페스트","20세기의 상처와 회복","--bud"]];
  return `<div class="mini-tl">${st.map(([e,n,t,c],i)=>`<div class="mt-s" style="--c:var(${c})"><span class="mt-e">${e}</span><b>${n}</b><small>${t}</small></div>${i<2?`<span class="mt-arrow">→</span>`:""}`).join("")}</div>`;
}
const INTRO_ILL = {0:()=>miniMap("flags"), 1:()=>miniMap("rivers"), 2:()=>miniTimeline()};

const INFO_NAV = [["i-bg","배경"],["i-cty","나라"],["i-city","도시"],["i-art","작품"],["i-spot","명소"],["i-tip","꿀팁"],["i-prep","준비"]];
function renderInfo(){
  const el=$("#scroll"), G=GUIDE;
  const countries = G.countries.map(c=>`<details class="gd" style="--c:var(${c.c})" id="c-${c.id}">
      <summary><span class="flag">${FLAG[c.id]}</span><span class="gd-t"><b>${esc(c.name)}</b><small>${esc(c.hook)}</small></span></summary>
      <div class="gd-b"><figure class="hero"><img class="lead-img" data-wiki="${COUNTRY_IMG[c.id][0]}" alt="${esc(COUNTRY_IMG[c.id][1])}" loading="lazy"><figcaption>${COUNTRY_IMG[c.id][1]}</figcaption></figure>
        <div class="meta-row"><span>${esc(c.lang)}</span><span>${esc(c.cur)}</span></div>
        ${c.paras.map(p=>`<p>${rich(p)}</p>`).join("")}
        <div class="st-box"><div class="st-k">✨ 알면 재밌는 것</div><ul>${c.fun.map(x=>`<li>${rich(x)}</li>`).join("")}</ul></div>
        <div class="st-k" style="margin-top:4px">🗣️ 한마디 현지어</div>
        <div class="phr">${c.phrases.map(([k,r,o])=>`<div><span>${esc(k)}</span><b>${esc(r)}</b><small>${esc(o)}</small></div>`).join("")}</div>
      </div></details>`).join("");
  const cities = G.cities.map(c=>`<details class="gd" style="--c:var(${c.c})" id="ct-${c.id}">
      <summary><span class="flag">${FLAG[c.id]}</span><span class="gd-t"><b>${esc(c.name)} <em>${esc(c.days)}</em></b><small>${esc(c.hook)}</small></span></summary>
      <div class="gd-b">${photoSlot("city-"+c.id, c.en)}${c.paras.map(p=>`<p>${rich(p)}</p>`).join("")}
        <div class="st-box"><div class="st-k">📌 알아두면 좋은 것</div><ul>${c.know.map(x=>`<li>${rich(x)}</li>`).join("")}</ul></div>${CITY_FUN[c.id]?`<div class="st-box fun"><div class="st-k">✨ 알면 재밌는 것</div><ul>${CITY_FUN[c.id].map(x=>`<li>${rich(x)}</li>`).join("")}</ul></div>`:""}</div></details>`).join("");
  const spots = G.cities.map(c=>{
    const list = STORIES.filter(s=>s.city===c.id); if (!list.length) return "";
    return `<div class="spot-city" style="--c:var(${c.c})">${FLAG[c.id]} ${esc(c.name)}</div>` + list.map(st=>{ const w=whereInPlan(st);
      return `<details class="gd spot" style="--c:var(${c.c})" id="st-${st.id}"><summary><span class="gd-t"><b>${esc(st.name)}</b><small>${st.era?esc(st.era)+" · ":""}${w?`Day${w.day}`:""}</small></span></summary><div class="gd-b">${storyBody(st)}</div></details>`; }).join("");
  }).join("");
  el.innerHTML = `
  <nav class="inav" aria-label="여행 정보 목차">${INFO_NAV.map(([id,t])=>`<button data-jump="${id}">${t}</button>`).join("")}</nav>

  <section id="i-bg" class="isec">
    <div class="sec-t">📖 먼저 읽어요</div>
    <div class="intro-lead"><figure class="hero"><img class="lead-img" data-cq="Hungarian Parliament Building night Danube" data-fallback="Hungarian_Parliament_Building" alt="밤의 헝가리 국회의사당" loading="lazy"></figure><div class="k">ONE LINE</div><h3>${esc(G.intro.title)}</h3><p>${rich(G.intro.lead)}</p></div>
    ${G.intro.paras.map((p,i)=>`<div class="ip">${INTRO_ILL[i]?`<div class="ip-ill">${INTRO_ILL[i]()}</div>`:""}<span class="ic">${p.ic}</span><div><h4>${esc(p.h)}</h4><p>${rich(p.t)}</p></div></div>`).join("")}
    <div class="st-k" style="margin:16px 0 8px">⏳ 천 년을 한 번에</div>
    <ol class="tline">${G.intro.timeline.map(([y,t])=>`<li><span>${esc(y)}</span><p>${rich(t)}</p></li>`).join("")}</ol>
    <div class="st-k" style="margin:16px 0 8px">👑 이 이름은 계속 나와요</div>
    <div class="names">${G.intro.names.map(([n,t])=>`<div><img class="pimg" data-wiki="${esc(NAME_IMG[n]||"")}" alt="${esc(n)}" loading="lazy"><div><b>${rich(n)}</b><p>${rich(t)}</p></div></div>`).join("")}</div>
  </section>

  <section id="i-cty" class="isec"><div class="sec-t">나라별 이야기</div>${countries}</section>
  <section id="i-city" class="isec"><div class="sec-t">도시별 이야기</div>${cities}</section>
  <section id="i-art" class="isec"><div class="sec-t">꼭 봐야 할 작품</div><p class="tiny" style="margin:0 0 10px">박물관·궁전별로 옆으로 넘기며 보세요. 이미지는 위키백과에서 불러와요.</p>${ART.slice().sort((x,y)=>x.day-y.day).map(artCarousel).join("")}</section>

  <section id="i-spot" class="isec"><div class="sec-t">명소별 이야기</div><p class="tiny" style="margin:0 0 10px">일정 탭의 장소 카드에서 <b>이야기</b> 버튼을 눌러도 같은 내용을 볼 수 있어요.</p>${spots}</section>

  <section id="i-tip" class="isec"><div class="sec-t">여행 꿀팁</div>
    ${[SEE_LIKE_GUIDE].concat(G.tips).map(t=>`<div class="tipg"><div class="st-k">${({"가이드처럼 보는 법":"🎙️","돈과 결제":"💳","교통":"🚋","식당과 카페":"☕","안전과 매너":"🛡️","날씨와 옷":"🧥"})[t.t]||""} ${esc(t.t)}</div><ul>${t.items.map(x=>`<li>${rich(x)}</li>`).join("")}</ul></div>`).join("")}
  </section>

  <section id="i-prep" class="isec"><div class="sec-t">준비</div>
    <div class="actions" style="margin-bottom:12px">
      <a class="btn sm" href="https://www.google.com/search?q=${enc("유로 원 환율")}" target="_blank" rel="noopener">${IC.link}유로 환율</a>
      <a class="btn sm" href="https://www.google.com/search?q=${enc("체코 코루나 원 환율")}" target="_blank" rel="noopener">${IC.link}코루나 환율</a>
      <a class="btn sm" href="https://www.google.com/search?q=${enc("헝가리 포린트 원 환율")}" target="_blank" rel="noopener">${IC.link}포린트 환율</a>
    </div>
    <div class="facts">
      <div><span>시차</span><b>한국보다 7시간 느림 (10/25까지 서머타임)</b></div>
      <div><span>긴급 전화</span><b>112 (유럽 공통)</b></div>
    </div>
  </section>`;
  el.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ const t=document.getElementById(b.dataset.jump); if(!t) return;
    if (!isDesktop() && $("#sheet").dataset.pos!=="full") setSheet("full");
    el.scrollTo({top:t.offsetTop-54, behavior:"smooth"}); });
  bindGoto(el); hydrateArt(el); bindArtTiles(el);
  el.querySelectorAll("img[data-cq]:not([data-state])").forEach(async im=>{
    im.dataset.state="loading";
    try { const l = await commonsFor(im.dataset.cq); if (l.length) { setImg(im, l[0]); return; } } catch {}
    im.removeAttribute("data-state"); im.dataset.wiki = im.dataset.fallback; loadArtImg(im);
  });
  el.querySelectorAll("details").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open){ hydrateArt(d); hydratePhotos(d); } }));
}
function bindGoto(root){
  root.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    const [d,i]=b.dataset.goto.split(":").map(Number);
    closeStory(); setDay(d); setTimeout(()=>select(i,true), 350);
  });
}
function openStory(st){
  const c = CITY_OF_STORY(st.city);
  $("#storyTitle").textContent = st.name;
  $("#storyMeta").textContent = `${FLAG[st.city]||""} ${c?c.name:""}${st.era?" · "+st.era:""}`;
  $("#storyBody").innerHTML = storyBody(st);
  $("#story").style.setProperty("--c", c?`var(${c.c})`:"var(--ink)");
  $("#story").hidden = false; $("#storyBody").scrollTop = 0;
  bindGoto($("#storyBody")); hydrateArt($("#storyBody")); hydratePhotos($("#storyBody")); bindArtTiles($("#storyBody"));
}
function closeStory(){ $("#story").hidden = true; }

/* ================= router ================= */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===state.tab));
  if (state.tab==="plan") renderPlan(); else if (state.tab==="book") renderBook(); else renderInfo();
}
function setTab(t){ state.tab=t; store.set("tab",t); $("#scroll").scrollTop=0; render(); if(!isDesktop() && $("#sheet").dataset.pos==="peek") setSheet("half"); }
function setDay(i){ state.day=i; state.sel=null; store.set("day",i); if(state.tab!=="plan"){state.tab="plan"; store.set("tab","plan");} renderChips(); $("#scroll").scrollTop=0; render(); drawMap(); }
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setTab(t.dataset.tab));

(async function start(){
  setSheet("half");
  renderChips();
  if (GD.on()) { GD.restore(); GD.loadGIS().catch(()=>{}); }
  await loadFiles();
  render();
  wxLoad(); setInterval(()=>wxLoad(), 30*60e3);
  initMap();
  drawMap();
  if (GD.on() && GD.valid()) GD.list().then(renderBookKeep).catch(()=>{});
  try { if ("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)) navigator.serviceWorker.register("sw.js"); } catch {}
})();
</script>
